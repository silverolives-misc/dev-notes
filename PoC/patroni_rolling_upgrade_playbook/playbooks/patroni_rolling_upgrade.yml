---
# Playbook: Patroni-aware PostgreSQL upgrade - minor (rolling) or major
#
# Which upgrade runs is decided per host by host_vars/group_vars:
#   postgres_minor_upgrade_enabled: true   -> rolling minor upgrade
#   postgres_major_upgrade_enabled: true   -> maintenance-window major upgrade
#   neither                                -> normal PostgreSQL roles only
# Setting both on one host, or minor on some hosts and major on others in
# the same run, fails before anything is touched.
#
# This playbook only works out WHICH hosts play which part and in WHAT
# ORDER; the actions live in roles/postgres_minor_upgrade and
# roles/postgres_major_upgrade.
#
# Flow:
#   Play 1 - normal path when no upgrade is enabled
#   Play 2 - discovery on every host in "all": derives patroni_upgrade_type
#            and, for hosts being upgraded, each host's Patroni role
#   Play 3 - localhost builds the in-memory groups from hostvars
#   Play 4 - MINOR: rolling upgrade, replicas first, leader last, serial 1
#   Play 5 - MAJOR: prepare every node in parallel
#   Play 6 - MAJOR: upgrade the leader (write downtime here)
#   Play 7 - MAJOR: rebuild replicas against the upgraded leader
#   Play 8 - MAJOR: resume Patroni and show the final state
#   Plays for the type that isn't enabled match no hosts and are skipped.
#
# Expected variables:
#   postgres_minor_upgrade_enabled / postgres_major_upgrade_enabled
#   patroni_api_scheme: http or https, defaults to http
#   patroni_api_port: defaults to 8008
#   patroni_api_host: optional per-host override for the API listener IP
#   Major upgrade: see roles/postgres_major_upgrade/defaults/main.yml
#     (versions, transfer mode, backup, replica_serial, ...)

# -------------------------------------------------------------------
# Play 1 - Normal path when no upgrade is enabled
# -------------------------------------------------------------------
- name: Run normal roles when no upgrade is enabled
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Run normal PostgreSQL roles
      ansible.builtin.import_role:
        name: normal_postgres_roles
      when:
        - not (postgres_minor_upgrade_enabled | default(false) | bool)
        - not (postgres_major_upgrade_enabled | default(false) | bool)


# -------------------------------------------------------------------
# Play 2 - Discovery runs on each host in the environment all group
# -------------------------------------------------------------------
- name: Discover Patroni role on each environment host
  hosts: all
  gather_facts: true
  become: false

  tasks:
    - name: Reject a host with both minor and major upgrade enabled
      ansible.builtin.assert:
        that:
          - not ((postgres_minor_upgrade_enabled | default(false) | bool)
                 and (postgres_major_upgrade_enabled | default(false) | bool))
        fail_msg: >-
          {{ inventory_hostname }} has both postgres_minor_upgrade_enabled and
          postgres_major_upgrade_enabled set - enable only one.

    - name: Work out which upgrade this host is part of
      ansible.builtin.set_fact:
        patroni_upgrade_type: >-
          {{ 'major' if (postgres_major_upgrade_enabled | default(false) | bool)
             else ('minor' if (postgres_minor_upgrade_enabled | default(false) | bool)
             else 'none') }}

    - name: Set Patroni API discovery URL
      ansible.builtin.set_fact:
        patroni_api_url: >-
          {{ patroni_api_scheme | default('http') }}://{{ patroni_api_host | default(ansible_default_ipv4.address) }}:{{ patroni_api_port | default(8008) }}/patroni
      when: patroni_upgrade_type != 'none'

    - name: Query Patroni API locally from each node
      ansible.builtin.uri:
        url: "{{ patroni_api_url }}"
        method: GET
        return_content: true
        validate_certs: false
        use_proxy: false
        status_code: 200
        timeout: 10
      register: patroni_api_result
      when: patroni_upgrade_type != 'none'

    - name: Store Patroni discovery facts on each host
      ansible.builtin.set_fact:
        patroni_discovered: true
        patroni_role: "{{ patroni_api_result.json.role | default('unknown') }}"
        patroni_state: "{{ patroni_api_result.json.state | default('unknown') }}"
        patroni_api_raw_json: "{{ patroni_api_result.json }}"
      when: patroni_upgrade_type != 'none'

    - name: Show discovered Patroni role
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          upgrade_type: "{{ patroni_upgrade_type }}"
          api_url: "{{ patroni_api_url }}"
          role: "{{ patroni_role }}"
          state: "{{ patroni_state }}"
      when: patroni_upgrade_type != 'none'


# -------------------------------------------------------------------
# Play 3 - Build in-memory groups from hostvars on localhost
# -------------------------------------------------------------------
- name: Build in-memory Patroni upgrade inventory
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    upgrade_types_present: "{{ groups['all'] | map('extract', hostvars, 'patroni_upgrade_type') | unique | reject('equalto', 'none') | list }}"

  tasks:
    - name: Show upgrade types present in this run
      ansible.builtin.debug:
        var: upgrade_types_present

    - name: Reject mixing minor and major upgrades in one run
      ansible.builtin.assert:
        that:
          - upgrade_types_present | length <= 1
        fail_msg: >-
          Hosts in this run are enabled for both minor and major upgrades
          ({{ upgrade_types_present }}). Run one type at a time.

    - name: Fail if any host being upgraded was not discovered
      ansible.builtin.assert:
        that:
          - hostvars[item].patroni_discovered | default(false) | bool
          - hostvars[item].patroni_role | default('unknown') != 'unknown'
        fail_msg: "Patroni discovery failed or returned unknown role for {{ item }}"
      loop: "{{ groups['all'] }}"
      when: hostvars[item].patroni_upgrade_type != 'none'

    # ---- minor: replicas first, leader last, one at a time ------------
    - name: Add minor-upgrade replicas to rolling upgrade group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - patroni_replicas
          - patroni_rolling_upgrade
        patroni_role: "{{ hostvars[item].patroni_role }}"
        patroni_state: "{{ hostvars[item].patroni_state }}"
      loop: "{{ groups['all'] }}"
      when:
        - hostvars[item].patroni_upgrade_type == 'minor'
        - hostvars[item].patroni_role in ['replica', 'standby_leader']

    - name: Add minor-upgrade leader to leader group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - patroni_leader
        patroni_role: "{{ hostvars[item].patroni_role }}"
        patroni_state: "{{ hostvars[item].patroni_state }}"
      loop: "{{ groups['all'] }}"
      when:
        - hostvars[item].patroni_upgrade_type == 'minor'
        - hostvars[item].patroni_role in ['leader', 'primary', 'master']

    - name: Add minor-upgrade leader last to rolling upgrade group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - patroni_rolling_upgrade
        patroni_role: "{{ hostvars[item].patroni_role }}"
        patroni_state: "{{ hostvars[item].patroni_state }}"
      loop: "{{ groups['all'] }}"
      when:
        - hostvars[item].patroni_upgrade_type == 'minor'
        - hostvars[item].patroni_role in ['leader', 'primary', 'master']

    - name: Fail if rolling upgrade group is empty
      ansible.builtin.assert:
        that:
          - groups['patroni_rolling_upgrade'] | default([]) | length > 0
        fail_msg: "patroni_rolling_upgrade group is empty after discovery"
      when: "'minor' in upgrade_types_present"

    - name: Show final minor rolling upgrade order
      ansible.builtin.debug:
        msg: "{{ groups['patroni_rolling_upgrade'] | default([]) }}"
      when: "'minor' in upgrade_types_present"

    # ---- major: one leader, plus replicas -----------------------------
    - name: Add major-upgrade leader to its group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - patroni_major_leader
        patroni_role: "{{ hostvars[item].patroni_role }}"
      loop: "{{ groups['all'] }}"
      when:
        - hostvars[item].patroni_upgrade_type == 'major'
        - hostvars[item].patroni_role in ['leader', 'primary', 'master']

    - name: Add major-upgrade replicas to their group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - patroni_major_replicas
        patroni_role: "{{ hostvars[item].patroni_role }}"
      loop: "{{ groups['all'] }}"
      when:
        - hostvars[item].patroni_upgrade_type == 'major'
        - hostvars[item].patroni_role in ['replica', 'standby_leader']

    - name: Fail if there isn't exactly one major-upgrade leader
      ansible.builtin.assert:
        that:
          - groups['patroni_major_leader'] | default([]) | length == 1
        fail_msg: >-
          Expected exactly one Patroni leader for the major upgrade, found
          {{ groups['patroni_major_leader'] | default([]) | length }}:
          {{ groups['patroni_major_leader'] | default([]) }}
      when: "'major' in upgrade_types_present"

    - name: Show major-upgrade leader and replica groups
      ansible.builtin.debug:
        msg:
          leader: "{{ groups['patroni_major_leader'] | default([]) }}"
          replicas: "{{ groups['patroni_major_replicas'] | default([]) }}"
      when: "'major' in upgrade_types_present"


# -------------------------------------------------------------------
# Play 4 - MINOR: rolling upgrade using the in-memory group
# -------------------------------------------------------------------
- name: Perform Patroni rolling minor upgrade
  hosts: patroni_rolling_upgrade
  gather_facts: true
  become: true
  serial: 1
  # A node that fails and rolls back should stop the whole rolling upgrade
  # rather than let Ansible silently continue on to the next host (or the
  # leader) with one member already known to be broken.
  any_errors_fatal: true

  tasks:
    - name: Show host being upgraded
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          patroni_role: "{{ patroni_role | default('unknown') }}"

    - name: Run PostgreSQL minor upgrade role
      ansible.builtin.import_role:
        name: postgres_minor_upgrade


# -------------------------------------------------------------------
# Play 5 - MAJOR: prepare every node before anything is paused or changed
# -------------------------------------------------------------------
- name: Prepare every node for the major upgrade
  hosts: patroni_major_leader:patroni_major_replicas
  gather_facts: true
  become: true
  # One node failing preflight/install stops the whole run before the
  # cluster is touched, rather than starting against a broken topology.
  any_errors_fatal: true

  tasks:
    - name: Run PostgreSQL major upgrade role (prepare)
      ansible.builtin.import_role:
        name: postgres_major_upgrade
      vars:
        postgres_major_upgrade_phase: prepare


# -------------------------------------------------------------------
# Play 6 - MAJOR: upgrade the leader (write downtime here)
# -------------------------------------------------------------------
- name: Upgrade Patroni leader to the new major version
  hosts: patroni_major_leader
  gather_facts: true
  become: true
  any_errors_fatal: true

  tasks:
    - name: Run PostgreSQL major upgrade role (upgrade)
      ansible.builtin.import_role:
        name: postgres_major_upgrade
      vars:
        postgres_major_upgrade_phase: upgrade


# -------------------------------------------------------------------
# Play 7 - MAJOR: rebuild each replica against the upgraded leader
# -------------------------------------------------------------------
- name: Rebuild Patroni replicas on the new major version
  hosts: patroni_major_replicas
  gather_facts: true
  become: true
  serial: "{{ postgres_major_upgrade_replica_serial | default(1) }}"
  # A replica that fails and rolls back should stop the whole major
  # upgrade rather than let Ansible carry on rebuilding the rest with one
  # member already known to be broken.
  any_errors_fatal: true

  tasks:
    - name: Run PostgreSQL major upgrade role (upgrade)
      ansible.builtin.import_role:
        name: postgres_major_upgrade
      vars:
        postgres_major_upgrade_phase: upgrade


# -------------------------------------------------------------------
# Play 8 - MAJOR: resume the cluster and show the final state
# -------------------------------------------------------------------
- name: Finish the major upgrade
  hosts: patroni_major_leader
  gather_facts: false
  become: true

  tasks:
    - name: Run PostgreSQL major upgrade role (finish)
      ansible.builtin.import_role:
        name: postgres_major_upgrade
      vars:
        postgres_major_upgrade_phase: finish
