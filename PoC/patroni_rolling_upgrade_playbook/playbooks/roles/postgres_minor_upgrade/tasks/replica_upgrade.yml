---
- name: Upgrade replica, rolling back if it fails to come back healthy
  block:
    - name: Upgrade PostgreSQL package on replica
      ansible.builtin.include_tasks: upgrade_package.yml
      vars:
        postgres_minor_upgrade_install_spec: "{{ postgres_minor_upgrade_package_spec }}"
        postgres_minor_upgrade_install_state: "{{ 'present' if postgres_minor_upgrade_package_version else 'latest' }}"

    - name: Wait for replica to rejoin cluster as healthy
      ansible.builtin.include_role:
        name: patroni_common
        tasks_from: wait_for_healthy
      vars:
        expected_roles: "{{ patronictl_replica_roles }}"

  rescue:
    - name: Roll back replica to its pre-upgrade package version
      ansible.builtin.include_tasks: rollback.yml
      vars:
        expected_roles: "{{ patronictl_replica_roles }}"

    - name: Fail after successful rollback to halt the rolling upgrade
      ansible.builtin.fail:
        msg: >-
          Upgrade of {{ patroni_member_name }} failed and was rolled back to
          {{ postgres_minor_upgrade_previous_package_version }}. The node is
          healthy again; investigate the upgrade failure before retrying.
