---
# Entry point. The calling playbook only decides WHICH hosts run and in
# what order (all nodes, then the leader, then replicas one at a time, then
# the leader again); every action lives in this role, selected by
# postgres_major_upgrade_phase:
#
#   prepare - every node, in parallel, before anything is touched: acknowledgement
#             gate, transfer-mode/disk preflight, package install, and (leader)
#             pg_upgrade --check
#   upgrade - leader: pgBackRest backup, pause Patroni, pg_upgrade in place
#             replica: rebuild against the upgraded leader (patronictl reinit)
#   finish  - leader: resume Patroni and show the final cluster state

- name: Assert a known phase was requested by the calling playbook
  ansible.builtin.assert:
    that:
      - postgres_major_upgrade_phase is defined
      - postgres_major_upgrade_phase in ['prepare', 'upgrade', 'finish']
    fail_msg: >-
      postgres_major_upgrade_phase must be prepare, upgrade or finish
      (got: {{ postgres_major_upgrade_phase | default('undefined') }})

- name: Assert patroni_role hostvar was provided by the calling playbook
  ansible.builtin.include_role:
    name: patroni_common
    tasks_from: assert_patroni_role

- name: Assert old and new version are set and different
  ansible.builtin.assert:
    that:
      - postgres_major_upgrade_old_version | string != postgres_major_upgrade_new_version | string
    fail_msg: >-
      postgres_major_upgrade_old_version and postgres_major_upgrade_new_version
      must be set to different values
      (got: {{ postgres_major_upgrade_old_version }} -> {{ postgres_major_upgrade_new_version }})

- name: Load OS-family specific bin_dir/data_dir/package spec
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Run prepare phase
  ansible.builtin.include_tasks: prepare.yml
  when: postgres_major_upgrade_phase == 'prepare'

- name: Run upgrade phase
  ansible.builtin.include_tasks: upgrade.yml
  when: postgres_major_upgrade_phase == 'upgrade'

- name: Run finish phase
  ansible.builtin.include_tasks: finish.yml
  when: postgres_major_upgrade_phase == 'finish'
