---
# Preflight, run on every node before anything is paused, installed or
# touched. Checks against the filesystem the NEW data directory will
# actually land on (looked up from gathered mount facts, so it doesn't need
# to exist yet), not just wherever the old one lives:
#   - link/clone (leader): old and new must be on the same filesystem, and
#     for clone the filesystem must support reflinks
#   - copy (leader) and every replica in any mode: enough free space for a
#     second full copy (replicas basebackup a fresh copy into the new
#     data_dir while the old one stays in place for rollback)

- name: Load OS-family specific bin_dir/data_dir/package spec
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Require a supported transfer mode
  ansible.builtin.assert:
    that:
      - postgres_major_upgrade_mode in ['clone', 'copy', 'link']
      - postgres_major_upgrade_mode != 'clone' or (postgres_major_upgrade_new_version | int) >= 12
    fail_msg: >-
      postgres_major_upgrade_mode must be one of clone, copy, link (got
      '{{ postgres_major_upgrade_mode }}'), and clone needs a target of
      PostgreSQL 12 or newer.

# Refreshes only the mount facts (size_available etc.) at the moment of the
# check, rather than relying on whatever the play's earlier gather_facts
# saw, without paying for a full hardware gather.
- name: Refresh filesystem facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - mounts

- name: Look up the filesystems holding the old and new data directories
  ansible.builtin.set_fact:
    postgres_major_upgrade_mounts: >-
      {%- set ns = namespace(old=none, new=none) -%}
      {%- for m in ansible_facts.mounts -%}
      {%- set mp = m.mount.rstrip('/') ~ '/' -%}
      {%- if (postgres_major_upgrade_old_data_dir ~ '/').startswith(mp)
             and (ns.old is none or m.mount | length > ns.old.mount | length) -%}{%- set ns.old = m -%}{%- endif -%}
      {%- if (postgres_major_upgrade_new_data_dir ~ '/').startswith(mp)
             and (ns.new is none or m.mount | length > ns.new.mount | length) -%}{%- set ns.new = m -%}{%- endif -%}
      {%- endfor -%}
      {{ {'old': ns.old, 'new': ns.new} }}

- name: Fail if either data directory could not be matched to a mounted filesystem
  ansible.builtin.assert:
    that:
      - postgres_major_upgrade_mounts.old is not none
      - postgres_major_upgrade_mounts.new is not none
    fail_msg: >-
      {{ inventory_hostname }}: no mount in ansible_facts.mounts covers
      {{ postgres_major_upgrade_old_data_dir }} or
      {{ postgres_major_upgrade_new_data_dir }} - did the mounts subset of setup return nothing?

# No native module measures a directory tree's size without listing every
# file in it, which is far slower than du on a real data directory.
- name: Measure old data directory size
  ansible.builtin.command:
    argv: [du, -sb, "{{ postgres_major_upgrade_old_data_dir }}"]
  register: postgres_major_upgrade_du
  changed_when: false

- name: Set preflight facts
  ansible.builtin.set_fact:
    postgres_major_upgrade_is_leader: "{{ patroni_role in ['leader', 'primary', 'master'] }}"
    postgres_major_upgrade_same_fs: >-
      {{ postgres_major_upgrade_mounts.old.mount == postgres_major_upgrade_mounts.new.mount }}
    postgres_major_upgrade_old_bytes: "{{ postgres_major_upgrade_du.stdout.split()[0] | int }}"
    postgres_major_upgrade_free_bytes: "{{ postgres_major_upgrade_mounts.new.size_available | int }}"
    postgres_major_upgrade_test_dir: "{{ postgres_major_upgrade_mounts.new.mount }}"

- name: Require old and new data directories on the same filesystem (link/clone)
  ansible.builtin.assert:
    that:
      - postgres_major_upgrade_same_fs | bool
    fail_msg: >-
      {{ inventory_hostname }}: {{ postgres_major_upgrade_new_data_dir }} would be
      created on a different filesystem from {{ postgres_major_upgrade_old_data_dir }}
      (new: {{ postgres_major_upgrade_mounts.new.mount }}, old: {{ postgres_major_upgrade_mounts.old.mount }}), but
      postgres_major_upgrade_mode={{ postgres_major_upgrade_mode }} needs both on
      the same one. Mount/point the new data directory correctly, or use copy.
  when:
    - postgres_major_upgrade_is_leader | bool
    - postgres_major_upgrade_mode in ['link', 'clone']

# Tests the destination filesystem's mount point (always exists, always on
# the right filesystem) with a throwaway file removed straight after.
- name: Test that the filesystem supports reflinks (clone)
  ansible.builtin.command:
    argv:
      - cp
      - --reflink=always
      - "{{ postgres_major_upgrade_old_data_dir }}/global/pg_control"
      - "{{ postgres_major_upgrade_test_dir }}/.pg_upgrade_reflink_check"
  register: postgres_major_upgrade_reflink_test
  changed_when: false
  ignore_errors: true
  when:
    - postgres_major_upgrade_is_leader | bool
    - postgres_major_upgrade_mode == 'clone'

- name: Remove reflink test file
  ansible.builtin.file:
    path: "{{ postgres_major_upgrade_test_dir }}/.pg_upgrade_reflink_check"
    state: absent
  when:
    - postgres_major_upgrade_is_leader | bool
    - postgres_major_upgrade_mode == 'clone'

- name: Fail if reflinks are not supported
  ansible.builtin.assert:
    that:
      - postgres_major_upgrade_reflink_test is succeeded
    fail_msg: >-
      {{ inventory_hostname }}: reflink copy failed on
      {{ postgres_major_upgrade_test_dir }}
      ({{ postgres_major_upgrade_reflink_test.stderr | default('') | trim }}).
      This filesystem can't do pg_upgrade --clone (XFS needs reflink=1, see
      `xfs_info <mount>`). Use postgres_major_upgrade_mode=copy instead.
  when:
    - postgres_major_upgrade_is_leader | bool
    - postgres_major_upgrade_mode == 'clone'

- name: Test that hard links work between the old and new locations (link)
  ansible.builtin.file:
    src: "{{ postgres_major_upgrade_old_data_dir }}/global/pg_control"
    dest: "{{ postgres_major_upgrade_test_dir }}/.pg_upgrade_hardlink_check"
    state: hard
  register: postgres_major_upgrade_hardlink_test
  ignore_errors: true
  when:
    - postgres_major_upgrade_is_leader | bool
    - postgres_major_upgrade_mode == 'link'

- name: Remove hard link test file
  ansible.builtin.file:
    path: "{{ postgres_major_upgrade_test_dir }}/.pg_upgrade_hardlink_check"
    state: absent
  when:
    - postgres_major_upgrade_is_leader | bool
    - postgres_major_upgrade_mode == 'link'

- name: Fail if hard links are not possible
  ansible.builtin.assert:
    that:
      - postgres_major_upgrade_hardlink_test is succeeded
    fail_msg: >-
      {{ inventory_hostname }}: hard link from {{ postgres_major_upgrade_old_data_dir }}
      to {{ postgres_major_upgrade_test_dir }} failed
      ({{ postgres_major_upgrade_hardlink_test.msg | default('') }}).
      Use postgres_major_upgrade_mode=copy instead.
  when:
    - postgres_major_upgrade_is_leader | bool
    - postgres_major_upgrade_mode == 'link'

- name: Require room for a second full copy plus headroom
  ansible.builtin.assert:
    that:
      - >-
        (postgres_major_upgrade_free_bytes | int)
        >= ((postgres_major_upgrade_old_bytes | int)
            * (postgres_major_upgrade_disk_headroom_factor | float))
    fail_msg: >-
      {{ inventory_hostname }}: {{ postgres_major_upgrade_free_bytes }} bytes free
      where {{ postgres_major_upgrade_new_data_dir }} will be created; need
      {{ postgres_major_upgrade_disk_headroom_factor }}x the old data directory
      ({{ postgres_major_upgrade_old_bytes }} bytes) for a second copy.
  when: >-
    not (postgres_major_upgrade_is_leader | bool
         and postgres_major_upgrade_mode in ['link', 'clone'])

- name: Show preflight result
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      mode: "{{ postgres_major_upgrade_mode }}"
      old_data_bytes: "{{ postgres_major_upgrade_old_bytes }}"
      free_bytes: "{{ postgres_major_upgrade_free_bytes }}"
      same_filesystem: "{{ postgres_major_upgrade_same_fs }}"
