---
# Playbook: Patroni-aware PostgreSQL MAJOR version upgrade
#
# Unlike patroni_rolling_upgrade.yml (minor versions, live rolling), a
# major version upgrade changes the on-disk cluster format, so replicas
# cannot simply stream from a different major version. This is a
# maintenance-window operation, not a live rolling upgrade - expect write
# downtime while the leader is upgraded (Play 4).
#
# This playbook only works out WHICH hosts play which part and in WHAT
# ORDER. Every action (preflight, install, backup, pause, pg_upgrade,
# replica rebuild, resume) lives in roles/postgres_major_upgrade, selected
# per play by postgres_major_upgrade_phase - see the role's tasks/main.yml.
#
# Flow:
#   Play 1 - discovery runs on every host in the environment "all" group
#            (same pattern as patroni_rolling_upgrade.yml)
#   Play 2 - localhost builds patroni_leader (1 host) and patroni_replicas
#            in-memory groups from hostvars
#   Play 3 - phase "prepare" on every node in parallel, before anything is
#            paused or changed: fatal on any failure
#   Play 4 - phase "upgrade" on the leader (backup, pause, pg_upgrade)
#   Play 5 - phase "upgrade" on replicas, one at a time by default, only
#            once the leader has succeeded
#   Play 6 - phase "finish" on the leader (resume Patroni, show state)
#
# Expected variables (see roles/postgres_major_upgrade/defaults/main.yml):
#   postgres_major_upgrade_enabled: true|false
#   postgres_major_upgrade_old_version / postgres_major_upgrade_new_version
#   postgres_major_upgrade_mode: clone|copy|link
#   postgres_major_upgrade_backup_confirmed: must be true in link mode
#   postgres_major_upgrade_pgbackrest_stanza / _backup_type
#   postgres_major_upgrade_replica_serial: how many replicas to rebuild at once
#   patroni_api_scheme: http or https, defaults to http
#   patroni_api_port: defaults to 8008
#   patroni_api_host: optional per-host override for the API listener IP

# -------------------------------------------------------------------
# Play 1 - Discovery runs on each host in the environment all group
# -------------------------------------------------------------------
- name: Discover Patroni role on each environment host
  hosts: all
  gather_facts: true
  become: false

  tasks:
    - name: Set Patroni API discovery URL
      ansible.builtin.set_fact:
        patroni_api_url: >-
          {{ patroni_api_scheme | default('http') }}://{{ patroni_api_host | default(ansible_default_ipv4.address) }}:{{ patroni_api_port | default(8008) }}/patroni
      when: postgres_major_upgrade_enabled | bool

    - name: Query Patroni API locally from each node
      ansible.builtin.uri:
        url: "{{ patroni_api_url }}"
        method: GET
        return_content: true
        validate_certs: false
        use_proxy: false
        status_code: 200
        timeout: 10
      register: patroni_api_result
      when: postgres_major_upgrade_enabled | bool

    - name: Store Patroni discovery facts on each host
      ansible.builtin.set_fact:
        patroni_discovered: true
        patroni_role: "{{ patroni_api_result.json.role | default('unknown') }}"
        patroni_state: "{{ patroni_api_result.json.state | default('unknown') }}"
      when: postgres_major_upgrade_enabled | bool

    - name: Show discovered Patroni role
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          role: "{{ patroni_role }}"
          state: "{{ patroni_state }}"
      when: postgres_major_upgrade_enabled | bool


# -------------------------------------------------------------------
# Play 2 - Build in-memory leader/replica groups from hostvars
# -------------------------------------------------------------------
- name: Build in-memory Patroni major upgrade inventory
  hosts: localhost
  gather_facts: false
  become: false

  tasks:
    - name: Fail if any all-group host was not discovered
      ansible.builtin.assert:
        that:
          - hostvars[item].patroni_discovered | default(false) | bool
          - hostvars[item].patroni_role | default('unknown') != 'unknown'
        fail_msg: "Patroni discovery failed or returned unknown role for {{ item }}"
      loop: "{{ groups['all'] }}"
      when: postgres_major_upgrade_enabled | bool

    - name: Add current leader to leader group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - patroni_leader
        patroni_role: "{{ hostvars[item].patroni_role }}"
      loop: "{{ groups['all'] }}"
      when:
        - postgres_major_upgrade_enabled | bool
        - hostvars[item].patroni_role in ['leader', 'primary', 'master']

    - name: Add replicas to replica group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups:
          - patroni_replicas
        patroni_role: "{{ hostvars[item].patroni_role }}"
      loop: "{{ groups['all'] }}"
      when:
        - postgres_major_upgrade_enabled | bool
        - hostvars[item].patroni_role in ['replica', 'standby_leader']

    - name: Fail if there isn't exactly one leader
      ansible.builtin.assert:
        that:
          - groups['patroni_leader'] | default([]) | length == 1
        fail_msg: >-
          Expected exactly one Patroni leader, found
          {{ groups['patroni_leader'] | default([]) | length }}:
          {{ groups['patroni_leader'] | default([]) }}
      when: postgres_major_upgrade_enabled | bool

    - name: Show leader and replica groups
      ansible.builtin.debug:
        msg:
          leader: "{{ groups['patroni_leader'] | default([]) }}"
          replicas: "{{ groups['patroni_replicas'] | default([]) }}"
      when: postgres_major_upgrade_enabled | bool


# -------------------------------------------------------------------
# Play 3 - Prepare every node before anything is paused or changed
# -------------------------------------------------------------------
- name: Prepare every node for the major upgrade
  hosts: patroni_leader:patroni_replicas
  gather_facts: true
  become: true
  # One node failing preflight/install stops the whole run before the
  # cluster is touched, rather than starting against a broken topology.
  any_errors_fatal: true

  tasks:
    - name: Run PostgreSQL major upgrade role (prepare)
      ansible.builtin.import_role:
        name: postgres_major_upgrade
      vars:
        postgres_major_upgrade_phase: prepare
      when: postgres_major_upgrade_enabled | bool


# -------------------------------------------------------------------
# Play 4 - Upgrade the leader (write downtime here)
# -------------------------------------------------------------------
- name: Upgrade Patroni leader to the new major version
  hosts: patroni_leader
  gather_facts: true
  become: true
  any_errors_fatal: true

  tasks:
    - name: Run PostgreSQL major upgrade role (upgrade)
      ansible.builtin.import_role:
        name: postgres_major_upgrade
      vars:
        postgres_major_upgrade_phase: upgrade
      when: postgres_major_upgrade_enabled | bool


# -------------------------------------------------------------------
# Play 5 - Rebuild each replica against the upgraded leader
# -------------------------------------------------------------------
- name: Rebuild Patroni replicas on the new major version
  hosts: patroni_replicas
  gather_facts: true
  become: true
  serial: "{{ postgres_major_upgrade_replica_serial | default(1) }}"
  # A replica that fails and rolls back should stop the whole major
  # upgrade rather than let Ansible carry on rebuilding the rest with one
  # member already known to be broken.
  any_errors_fatal: true

  tasks:
    - name: Run PostgreSQL major upgrade role (upgrade)
      ansible.builtin.import_role:
        name: postgres_major_upgrade
      vars:
        postgres_major_upgrade_phase: upgrade
      when: postgres_major_upgrade_enabled | bool


# -------------------------------------------------------------------
# Play 6 - Resume the cluster and show the final state
# -------------------------------------------------------------------
- name: Finish the major upgrade
  hosts: patroni_leader
  gather_facts: false
  become: true

  tasks:
    - name: Run PostgreSQL major upgrade role (finish)
      ansible.builtin.import_role:
        name: postgres_major_upgrade
      vars:
        postgres_major_upgrade_phase: finish
      when: postgres_major_upgrade_enabled | bool
