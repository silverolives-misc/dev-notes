[defaults]
# Override in the AAP job template as needed
forks                   = 20
roles_path              = ./roles
deprecation_warnings    = False
nocows                  = 1
# Patching runs are long; show per-task timing in AAP output
callbacks_enabled       = ansible.posix.profile_tasks

[ssh_connection]
ssh_args         = -o ControlMaster=auto -o ControlPersist=60s
pipelining       = True
control_path_dir = /tmp/.ansible-cp
