---
# ------------------------------------------------------------------------------
# Custom credential types used by the patching job templates.
# Loaded by configure_controller.yml; also usable as a reference when creating
# them by hand in the AAP UI (Automation Execution → Infrastructure →
# Credential Types).
# ------------------------------------------------------------------------------
patching_credential_types:

  - name: "Jira"
    description: "Jira REST API — Cloud (email + API token) or Data Center (PAT)"
    inputs:
      fields:
        - { id: url,      type: string, label: "Jira base URL", help_text: "e.g. https://example.atlassian.net" }
        - { id: username, type: string, label: "Username / email", help_text: "Blank for Data Center PAT" }
        - { id: token,    type: string, label: "API token / PAT", secret: true }
      required: [url, token]
    injectors:
      env:
        JIRA_URL:   "{{ '{{' }} url {{ '}}' }}"
        JIRA_USER:  "{{ '{{' }} username {{ '}}' }}"
        JIRA_TOKEN: "{{ '{{' }} token {{ '}}' }}"

  - name: "Device42"
    description: "Device42 API account for the device42.d42 inventory plugin"
    inputs:
      fields:
        - { id: url,      type: string, label: "Device42 URL" }
        - { id: username, type: string, label: "Username" }
        - { id: password, type: string, label: "Password", secret: true }
      required: [url, username, password]
    injectors:
      env:
        D42_URL:  "{{ '{{' }} url {{ '}}' }}"
        D42_USER: "{{ '{{' }} username {{ '}}' }}"
        D42_PWD:  "{{ '{{' }} password {{ '}}' }}"

  - name: "OLVM"
    description: "Oracle Linux Virtualization Manager engine API"
    inputs:
      fields:
        - { id: url,      type: string, label: "Engine API URL", help_text: "https://olvm.example.com/ovirt-engine/api" }
        - { id: username, type: string, label: "Username", help_text: "e.g. svc_ansible@internal" }
        - { id: password, type: string, label: "Password", secret: true }
        - { id: ca_pem,   type: string, label: "Engine CA certificate (PEM)", multiline: true,
            help_text: "https://<engine>/ovirt-engine/services/pki-resource?resource=ca-certificate&format=X509-PEM-CA" }
      required: [url, username, password, ca_pem]
    injectors:
      file:
        template.ca: "{{ '{{' }} ca_pem {{ '}}' }}"
      env:
        OVIRT_URL:      "{{ '{{' }} url {{ '}}' }}"
        OVIRT_USERNAME: "{{ '{{' }} username {{ '}}' }}"
        OVIRT_PASSWORD: "{{ '{{' }} password {{ '}}' }}"
        OVIRT_CA_FILE:  "{{ '{{' }} tower.filename.ca {{ '}}' }}"
