---
# ------------------------------------------------------------------------------
# dev/inventory/hosts.yml — static stand-in for the Device42 inventory.
#
# Mirrors what inventory/device42.d42.yml produces, so the playbooks see the
# same groups and variables they will in AAP:
#   patch_group_<value>   from the Device42 patch_group custom field
#   tag_<tag>             one group per Device42 tag
#   ansible_host          SSH address
#   olvm_vm_name          OLVM VM name (unused in snapshot test mode)
#
# Group "dev_oci" matches snapshot_test_mode_group_regex, so test mode is
# allowed for it. Add a second host to tag_patch_exclude to test exclusion.
# ------------------------------------------------------------------------------
all:
  children:

    patch_group_dev_oci:
      hosts:
        oltest01:
          ansible_host: "<private IP of the OCI test VM>"
          ansible_user: opc
          olvm_vm_name: oltest01

    tag_ansible_patching:
      hosts:
        oltest01:

    tag_patch_exclude:
      hosts: {}
