---
# generate_oracle_static_role_tfvars.yml
#
# Scales to a flat host list spanning MANY separate RAC clusters by:
#   1. Building a dynamic in-memory inventory from the 'exacc_node_list'
#      extra-var — no static inventory group required.
#   2. Fingerprinting each node's cluster membership via `olsnodes`
#      (cheap, read-only, safe to run on every node in parallel).
#   3. Selecting exactly ONE representative host per unique fingerprint.
#   4. Running the actual srvctl discovery only on representatives —
#      each one covers a distinct cluster, so this is correct in
#      parallel with no run_once assumption.
#   5. Aggregating all representatives' results into a single dict and
#      exposing it via set_stats for the downstream pipeline step.
#
# Required extra-vars:
#   exacc_node_list   YAML list of ExaCC node FQDNs to scan:
#                       -e '{"exacc_node_list": ["node1.example.com","node2.example.com"]}'
#                     or via a vars file / AWX survey.
#
# Required environment variables (same as rotate_sys_password.yml):
#   _CLIENT__HASHI_URL        Vault address
#   _CLIENT__HASHI_NAMESPACE  Vault namespace
#   _CLIENT__HASHI_ROLE       Vault role for OTP SSH auth
#
# Optional extra-vars:
#   grid_home      /u01/app/19.0.0.0/grid   (default)
#   dns_domain     systems.uk.hsbc           (default)
#   debug_output   false                     (set true to dump per-cluster maps)
#
# Output: exposed via set_stats (per_host: false) as oracle_static_roles.
#   AWX / Ansible Controller captures this automatically as a job artifact.
#
# ---------------------------------------------------------------------------

# ==============================================================================
# Play 1 | Build dynamic inventory from extra-var host list
# ==============================================================================

- name: "Build | Create in-memory inventory from exacc_node_list"
  hosts: localhost
  gather_facts: false

  tasks:

    - name: "Build | Assert exacc_node_list was provided"
      ansible.builtin.assert:
        that:
          - exacc_node_list is defined
          - exacc_node_list | type_debug != 'str'
          - exacc_node_list | length > 0
        fail_msg: >
          Required extra-var 'exacc_node_list' is missing, empty, or not a list.
          Pass as: -e '{"exacc_node_list": ["host1.example.com", "host2.example.com"]}'

    - name: "Build | Obtain Vault login token for OTP SSH auth"
      ansible.builtin.set_fact:
        login_token: "{{ lookup('_client_.epe.hashi_vault_login_token', token_ttl='6h') }}"
      no_log: true

    - name: "Build | Populate _exacc_nodes group from extra-var list"
      ansible.builtin.add_host:
        name:         "{{ item }}"
        groups:       _exacc_nodes
        ansible_host: "{{ item }}"
        ansible_user: ans_oracle
        login_token:  "{{ login_token }}"
      loop: "{{ exacc_node_list }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: "Build | Inventory summary"
      ansible.builtin.debug:
        msg: "Added {{ exacc_node_list | length }} node(s) to _exacc_nodes for cluster fingerprinting."


# ==============================================================================
# Play 2 | Fingerprint clusterware membership on every node
# ==============================================================================

- name: "Fingerprint | Run olsnodes on every node to detect cluster peers"
  hosts: _exacc_nodes
  gather_facts: false
  strategy: free
  ignore_unreachable: true
  remote_user: ans_oracle
  become: true
  become_user: oracle
  become_method: ansible.builtin.su
  vars:
    grid_home: "/u01/app/19.0.0.0/grid"
    srvctl_env:
      PATH: "{{ grid_home }}/bin:/usr/bin:/bin"
    ansible_ssh_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='ans_oracle') }}"
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='oracle') }}"

  tasks:

    - name: "Fingerprint | List this host's cluster peers via olsnodes"
      ansible.builtin.command: olsnodes
      environment: "{{ srvctl_env }}"
      register: olsnodes_result
      changed_when: false
      ignore_errors: true

    - name: "Fingerprint | Record canonical cluster fingerprint"
      ansible.builtin.set_fact:
        cluster_fingerprint: >-
          {{ olsnodes_result.stdout_lines | reject('equalto', '') | sort | join(',') }}
      when: olsnodes_result is succeeded


# ==============================================================================
# Play 3 | Select one representative host per unique cluster (localhost)
# ==============================================================================

- name: "Select | Pick one representative node per unique cluster fingerprint"
  hosts: localhost
  gather_facts: false

  tasks:

    - name: "Select | Render one representative per unique cluster fingerprint"
      ansible.builtin.set_fact:
        cluster_representatives_json: |-
          {%- set seen = [] -%}
          {%- set reps = [] -%}
          {%- for h in groups['_exacc_nodes'] -%}
            {%- if hostvars[h].cluster_fingerprint is defined -%}
              {%- set fp = hostvars[h].cluster_fingerprint -%}
              {%- if fp not in seen -%}
                {%- set _ = seen.append(fp) -%}
                {%- set _ = reps.append(h) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ reps | to_json }}

    - name: "Select | Parse representative host list"
      ansible.builtin.set_fact:
        cluster_representatives: "{{ cluster_representatives_json | from_json }}"

    - name: "Select | Register representatives into dynamic group"
      ansible.builtin.add_host:
        name:   "{{ item }}"
        groups: exacc_cluster_representatives
      loop: "{{ cluster_representatives }}"
      loop_control:
        label: "{{ item }}"

    - name: "Select | Discovery summary"
      ansible.builtin.debug:
        msg: >-
          {{ cluster_representatives | length }} distinct cluster(s) found
          among {{ groups['_exacc_nodes'] | length }} node(s)
          ({{ groups['_exacc_nodes'] | length
              - (groups['_exacc_nodes'] | map('extract', hostvars)
                 | selectattr('cluster_fingerprint', 'defined') | list | length) }}
          node(s) had no fingerprint — unreachable or olsnodes failed — excluded).


# ==============================================================================
# Play 4 | Discover DB topology per cluster (one run per representative)
# ==============================================================================

- name: "Discover | Run srvctl topology discovery on each cluster representative"
  hosts: exacc_cluster_representatives
  gather_facts: false
  strategy: free
  ignore_unreachable: true
  remote_user: ans_oracle
  become: true
  become_user: oracle
  become_method: ansible.builtin.su
  vars:
    grid_home: "/u01/app/19.0.0.0/grid"
    srvctl_env:
      PATH: "{{ grid_home }}/bin:/usr/bin:/bin"
    dns_domain:            "systems.uk.hsbc"
    oracle_role_usernames: ["sys"]
    role_suffix:           "EXACC"
    debug_output:          false
    ansible_ssh_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='ans_oracle') }}"
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='oracle') }}"

  tasks:

    - name: "Discover | Get list of database unique names for this cluster"
      ansible.builtin.command: srvctl config database
      environment: "{{ srvctl_env }}"
      register: srvctl_db_list
      changed_when: false

    - name: "Discover | Build db_unique_name list (drop blank lines)"
      ansible.builtin.set_fact:
        exacc_db_unique_names: "{{ srvctl_db_list.stdout_lines | reject('equalto', '') | list }}"

    - name: "Discover | Get host topology for each database in this cluster"
      ansible.builtin.command: srvctl status database -db "{{ item }}"
      environment: "{{ srvctl_env }}"
      loop: "{{ exacc_db_unique_names }}"
      register: srvctl_db_status
      changed_when: false

    - name: "Discover | Build db_unique_name → [hosts] topology map"
      ansible.builtin.set_fact:
        exacc_db_topology: >-
          {{
            exacc_db_topology | default({}) | combine({
              item.item: (item.stdout | regex_findall('is running on node (\S+)') | unique | sort)
            })
          }}
      loop: "{{ srvctl_db_status.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "Discover | Build oracle_static_roles map for this cluster"
      ansible.builtin.set_fact:
        oracle_static_roles: >-
          {{
            oracle_static_roles | default({}) | combine({
              role_key: role_val
            })
          }}
      vars:
        db_unique_name: "{{ item.0 }}"
        db_hosts:       "{{ exacc_db_topology[item.0] }}"
        db_fqdns:       "{{ db_hosts | map('regex_replace', '$', '.' ~ dns_domain) | list }}"
        role_username:  "{{ item.1 | upper }}"
        role_key:       "{{ role_username }}_{{ db_unique_name | upper }}_{{ role_suffix }}"
        role_val:
          username:       "{{ role_username }}"
          connection_url: "{{ db_fqdns | join(',') }}"
      with_nested:
        - "{{ exacc_db_topology.keys() | list }}"
        - "{{ oracle_role_usernames }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}"

    - name: "Discover | Show this cluster's role map (debug only)"
      ansible.builtin.debug:
        var: oracle_static_roles
      when: debug_output | bool


# ==============================================================================
# Play 5 | Aggregate all clusters and expose result via set_stats
# ==============================================================================

- name: "Aggregate | Combine all cluster results and publish to job artifacts"
  hosts: localhost
  gather_facts: false

  tasks:

    - name: "Aggregate | Combine oracle_static_roles across all cluster representatives"
      ansible.builtin.set_fact:
        oracle_static_roles_all: >-
          {{
            oracle_static_roles_all | default({}) | combine(
              hostvars[item].oracle_static_roles | default({})
            )
          }}
      loop: "{{ groups['exacc_cluster_representatives'] | default([]) }}"
      loop_control:
        label: "{{ item }}"

    - name: "Aggregate | Summary"
      ansible.builtin.debug:
        msg: >-
          {{ oracle_static_roles_all | length }} role(s) generated
          across {{ groups['exacc_cluster_representatives'] | default([]) | length }} cluster(s).

    - name: "Aggregate | Expose aggregated roles as AWX job artifact"
      ansible.builtin.set_stats:
        data:
          oracle_static_roles: "{{ oracle_static_roles_all }}"
        per_host:  false
        aggregate: false
