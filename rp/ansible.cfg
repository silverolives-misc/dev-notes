[defaults]
# Increase forks for large estate — override in AAP job template as needed
forks                   = 20

# Suppress deprecation warnings in AAP output
deprecation_warnings    = False

# Suppress cowsay in AAP output
nocows                  = 1

[ssh_connection]
# SSH multiplexing: reuses an established connection to the same host for all
# subsequent Ansible connections in the same job run. For ExaCC clusters with
# multiple databases (db_unique_names) on the same physical nodes, this means
# only one OTP lookup per physical host per play rather than one per database.
ssh_args        = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining      = True

# Prevent AAP execution node from exhausting file descriptors on large estates
control_path_dir = /tmp/.ansible-cp
