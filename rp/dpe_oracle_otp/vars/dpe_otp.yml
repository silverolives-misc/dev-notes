---
ansible_python_interpreter: /usr/bin/python3
_ansibleukenv:    'dev'

dpe_aap_group:
  name: 'ans_oracle'
  gid:  '200054503'

test123: 'Yes'

dpe_aap_account:
  name: 'ans_oracle'
  uid:  '200054503'
  shell: "/usr/bin/bash"
  groups:
    - 'wheel'
  pw_expire_max:   7
  pw_expire_min:  -1
  pw_expire_warn: -1
  pw_expires:     -1

vault_helper:
  package:      "_client_-hashi-vault-helper"
  configd:      "/etc/vault-ssh-helper.d"
  hcl_file_loc: "/etc/vault-ssh-helper.d/"
  bin:          "/usr/local/bin/vault-ssh-helper"
  namespace:
    - "ITID/12410399_AAP"
    - "ITID/243880_DPORAENG"

# yum/dnf repo definition that carries the vault_helper.package RPM.
# Needs to be present on the host before server_otp_setup.yml tries to
# install the package, and is checked (via repoquery) in client_check.yml.
#
# Uses dnf's own $releasever/$basearch repo variables rather than an
# Ansible fact: this dict is loaded onto localhost (gather_facts: no),
# so any Ansible fact referenced here would template against localhost's
# (nonexistent) facts, not the target host's. $releasever/$basearch are
# resolved by dnf itself, per host, at repo-refresh time - no Ansible
# templating involved, and Ansible passes the literal $-syntax through
# untouched since it isn't Jinja.
vault_helper_repo:
  id:          "_client_-tooling"
  description: "_client_ tooling repo"
  baseurl:     "https://GL-NLB-WEB-systems.hk._client_/repos/rhel/$releasever/$basearch/rhel-$releasever-tooling"
  enabled:     1
  gpgcheck:    0

otp_setup_ok: false

dpe_legacy_ssh_user: 'oraansible'
dpe_host_group: 'otp_test'

action_list:
  - 'check'
  - 'verify'
  - 'test'
  - 'setup'

authselect_otp_profile: 'exadata_otp'

pam_files:
  password_auth: "/etc/pam.d/password-auth"
  system_auth:   "/etc/pam.d/system-auth"
  sshd_file:     "/etc/pam.d/sshd"
