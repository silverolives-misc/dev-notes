---
# ------------------------------------------------------------------------------
# precheck_oracle.yml
# Assert Oracle DB health using facts set by detect_topology.yml.
#
# All RAC instance status, DB role, open mode, PDB status and Oracle version
# facts are now sourced from dbaascli database getDetails (detect_topology.yml).
# The only remaining sqlplus query here is for SYS account status (dba_users)
# which is not exposed by dbaascli. That query also serves as the implicit
# live connectivity test for the SYS credential.
# ------------------------------------------------------------------------------

# ==============================================================================
# Section 1 — Assert and display facts sourced from dbaascli (detect_topology)
# ==============================================================================

- name: "Oracle Pre-check | Assert topology facts were set by detect_topology"
  ansible.builtin.assert:
    that:
      - db_role is defined
      - db_name_actual is defined
      - oracle_version_full is defined
      - rac_nodes is defined
      - rac_nodes | length > 0
      - scan_address is defined
      - oracle_port is defined
    fail_msg: >
      One or more topology facts are missing. Ensure detect_topology.yml ran
      successfully before this task file.
    success_msg: "Topology facts confirmed present."

- name: "Oracle Pre-check | Display database identity"
  ansible.builtin.debug:
    msg:
      - "DB Name        : {{ db_name_actual }}"
      - "DB Unique Name : {{ db_unique_name_actual }}"
      - "DB Role        : {{ db_role }}"
      - "DB Type        : {{ db_type }}"
      - "CDB            : {{ is_cdb }}"
      - "Oracle Version : {{ oracle_version_full }}"
      - "Oracle Home    : {{ oracle_home }}"
      - "SCAN           : {{ scan_address }}:{{ oracle_port }}"
      - "Service        : {{ oracle_service }}"

# ==============================================================================
# Section 2 — DB role and open mode assertions
# ==============================================================================

- name: "Oracle Pre-check | Assert this is a PRIMARY database"
  ansible.builtin.assert:
    that:
      - db_role == 'PRIMARY'
    fail_msg: >
      Database role is '{{ db_role }}'. Rotation must be performed on PRIMARY only.
    success_msg: "Database role is PRIMARY."

- name: "Oracle Pre-check | Assert database type is RAC or SI"
  ansible.builtin.assert:
    that:
      - db_type in ['RAC', 'SI', 'SINGLE']
    fail_msg: "Unexpected dbType '{{ db_type }}'. Expected RAC or SI."
    success_msg: "Database type is {{ db_type }}."

# ==============================================================================
# Section 3 — RAC node status assertions (from dbNodeLevelDetails)
# ==============================================================================

- name: "Oracle Pre-check | Display RAC node statuses"
  ansible.builtin.debug:
    msg: >
      Node {{ item.nodeName }} (instance {{ item.instanceName }}):
      status={{ item.status }}
  loop: "{{ rac_nodes }}"
  loop_control:
    label: "{{ item.nodeName }}"

- name: "Oracle Pre-check | Assert all RAC nodes are OPEN"
  ansible.builtin.assert:
    that:
      - item.status == 'OPEN'
    fail_msg: >
      RAC node '{{ item.nodeName }}' (instance {{ item.instanceName }})
      status is '{{ item.status }}'. All nodes must be OPEN before rotation.
    success_msg: "Node {{ item.nodeName }} is OPEN."
  loop: "{{ rac_nodes }}"
  loop_control:
    label: "{{ item.nodeName }}"

# ==============================================================================
# Section 4 — PDB status assertions (from pdbs.pdbNodeLevelDetails)
# ==============================================================================

- name: "Oracle Pre-check | Display PDB statuses"
  ansible.builtin.debug:
    msg: "PDB {{ item[0] }}: open_mode={{ item[1] }}, restricted={{ item[2] }}"
  loop: "{{ pdb_list }}"
  loop_control:
    label: "{{ item[0] }}"

- name: "Oracle Pre-check | Assert no open PDBs are in RESTRICTED mode"
  ansible.builtin.assert:
    that:
      - item[2] == 'NO'
    fail_msg: >
      PDB '{{ item[0] }}' is in RESTRICTED mode. Investigate before rotation.
    success_msg: "PDB {{ item[0] }} is not restricted."
  loop: "{{ pdb_list }}"
  loop_control:
    label: "{{ item[0] }}"
  when: item[1] != 'MOUNTED'

# ==============================================================================
# Section 5 — SYS account status (sqlplus — only remaining query in this file)
#
# dba_users is not surfaced by dbaascli. This query also implicitly validates
# that sqlplus can connect with the current SYS credential and correct SCAN/port.
# ==============================================================================

- name: "Oracle Pre-check | Query SYS account status via sqlplus"
  ansible.builtin.shell: |
    {{ oracle_env }}
    sqlplus -s /nolog <<EOF
    {{ sqlplus_preamble }}
    CONNECT {{ sqlplus_connect }}
    SELECT account_status
           ||'|'|| NVL(TO_CHAR(expiry_date,'YYYY-MM-DD'),'NULL')
           ||'|'|| profile
           ||'|'|| NVL(TO_CHAR(last_login,'YYYY-MM-DD HH24:MI:SS'),'NULL')
    FROM   dba_users
    WHERE  username = 'SYS';
    EXIT;
    EOF
  register: sys_account_raw
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: oracle
  changed_when: false
  no_log: true

- name: "Oracle Pre-check | Assert sqlplus connected and returned SYS data"
  ansible.builtin.assert:
    that:
      - sys_account_raw.rc == 0
      - sys_account_raw.stdout_lines | select('match', '^[A-Z]') | list | length > 0
    fail_msg: >
      sqlplus failed to connect or returned no SYS data (RC={{ sys_account_raw.rc }}).
      SCAN={{ scan_address }}, Port={{ oracle_port }}, Service={{ oracle_service }}.
    success_msg: "sqlplus connected successfully with current SYS credential."

- name: "Oracle Pre-check | Parse SYS account facts"
  ansible.builtin.set_fact:
    _sys_parsed: >-
      {{
        sys_account_raw.stdout_lines
        | select('match', '^[A-Z]')
        | first
        | split('|')
        | map('trim')
        | list
      }}

- name: "Oracle Pre-check | Set SYS account facts"
  ansible.builtin.set_fact:
    sys_account_status_value: "{{ _sys_parsed[0] }}"
    sys_expiry_date:           "{{ _sys_parsed[1] }}"
    sys_profile:               "{{ _sys_parsed[2] }}"
    sys_last_login:            "{{ _sys_parsed[3] }}"

- name: "Oracle Pre-check | Display SYS account status"
  ansible.builtin.debug:
    msg:
      - "Account Status : {{ sys_account_status_value }}"
      - "Profile        : {{ sys_profile }}"
      - "Expiry Date    : {{ sys_expiry_date }}"
      - "Last Login     : {{ sys_last_login }}"

- name: "Oracle Pre-check | Assert SYS account is not locked"
  ansible.builtin.assert:
    that:
      - "'LOCKED' not in sys_account_status_value"
    fail_msg: >
      SYS account status is '{{ sys_account_status_value }}'.
      Unlock before attempting rotation.
    success_msg: "SYS account is not locked (status: {{ sys_account_status_value }})."
