---
# ------------------------------------------------------------------------------
# detect_topology.yml
# Runs dbaascli database getDetails once to derive the full topology.
#
# Replaces all sqlplus-based topology detection:
#   - v$dataguard_config / v$parameter / v$standby_log  → dgEnabled field
#   - gv$instance (RAC node status)                     → dbNodeLevelDetails
#   - v$database  (role, open mode)                     → dbRole / dbType
#   - v$pdbs      (PDB open mode + restricted)          → pdbs.pdbNodeLevelDetails
#   - v$instance  (Oracle version)                      → patchVersion
#   - oracle_home / scan_address / oracle_port          → derived from output
#
# Standby member details still require sqlplus (v$dataguard_config)
# as the dbaascli output only indicates dgEnabled not member hostnames.
# Commvault detection uses OS-level file/process checks (unchanged).
#
# Facts set by this file consumed downstream:
#   db_name_actual, db_unique_name_actual, db_domain
#   db_role, db_type, is_cdb
#   oracle_version_full, oracle_major_version
#   oracle_home, scan_address, oracle_port, oracle_service
#   dg_detected, commvault_detected
#   rac_nodes      — list of dbNodeLevelDetails dicts (nodeName,instanceName,status,homePath)
#   pdb_list       — list of [pdb_name, open_mode, restricted_str] tuples
#   dg_standby_members — list of [db_unique_name, role, enabled] (when dg_detected)
# ------------------------------------------------------------------------------

# ==============================================================================
# Section 1 — dbaascli database getDetails
# ==============================================================================

- name: "Topology | Run dbaascli database getDetails"
  ansible.builtin.command:
    cmd: "{{ dbaascli_path }} database getDetails --dbname {{ oracle_db_name | default(db_unique_name) }}"
  register: _dbaascli_config_raw
  become: true
  become_user: root
  delegate_to: "{{ node_fqdn }}"
  changed_when: false

- name: "Topology | Parse dbaascli JSON output"
  ansible.builtin.set_fact:
    _dbaascli_full_config: >-
      {{
        _dbaascli_config_raw.stdout
        | regex_search('(?s)(\{.*\})', '\1')
        | first
        | from_json
      }}

- name: "Topology | Assert dbaascli returned valid config for target database"
  ansible.builtin.set_fact:
    _db: "{{ _dbaascli_full_config }}"

- name: "Topology | Assert dbaascli returned valid config for target database"
  ansible.builtin.assert:
    that:
      - _db.dbName is defined
      - _db.dbRole is defined
    fail_msg: >
      dbaascli database getDetails did not return expected fields for
      '{{ oracle_db_name | default(db_unique_name) }}'.
      Check --dbname value and that dbaascli can see this database.
    success_msg: "dbaascli config retrieved for {{ _db.dbName }}."

# ==============================================================================
# Section 2 — Core database identity and role facts
# ==============================================================================

- name: "Topology | Set database identity and role facts"
  ansible.builtin.set_fact:
    db_name_actual:        "{{ _db.dbName }}"
    db_unique_name_actual: "{{ _db.dbUniqueName }}"
    db_domain:             "{{ _db.dbDomain }}"
    db_role:               "{{ _db.dbRole }}"
    db_type:               "{{ _db.dbType }}"
    is_cdb:                "{{ _db.isCDB | bool }}"
    oracle_version_full:   "{{ _db.patchVersion }}"
    oracle_major_version:  "{{ _db.patchVersion.split('.')[0] | int }}"
    dg_detected:           "{{ _db.dgEnabled | bool or dg_enabled | bool }}"

# ==============================================================================
# Section 3 — RAC node facts and oracle_home
# ==============================================================================

- name: "Topology | Set RAC node list and oracle_home from dbNodeLevelDetails"
  ansible.builtin.set_fact:
    rac_nodes: "{{ _db.dbNodeLevelDetails.values() | list }}"
    oracle_home: "{{ (_db.dbNodeLevelDetails.values() | first).homePath }}"

# ==============================================================================
# Section 4 — SCAN address and port from pdbConnectStrings
#
# connectString format: "<scan>:<port>/<service>"
# Uses the first PRIMARY connect string found across all PDBs.
# ==============================================================================

- name: "Topology | Extract first PRIMARY connect string"
  ansible.builtin.set_fact:
    _primary_cs: >-
      {{
        _db.pdbs.values()
        | map(attribute='pdbConnectStrings')
        | flatten
        | selectattr('serviceRole', 'equalto', 'PRIMARY')
        | map(attribute='connectString')
        | first
      }}

- name: "Topology | Set SCAN address, port and service from connect string"
  ansible.builtin.set_fact:
    scan_address: "{{ _primary_cs.split(':')[0] }}"
    oracle_port:  "{{ _primary_cs.split(':')[1].split('/')[0] }}"
    oracle_service: "{{ _primary_cs.split('/')[1] }}"

# ==============================================================================
# Section 5 — PDB status list
#
# Builds pdb_list as [[pdb_name, open_mode, restricted_str], ...] per PDB,
# summarised across all nodes:
#   open_mode    = READ_WRITE if any node is READ_WRITE, else MOUNTED
#   restricted   = YES if any node is restricted, else NO
# ==============================================================================

- name: "Topology | Build PDB status list from dbaascli"
  ansible.builtin.set_fact:
    pdb_list: >-
      {{
        pdb_list | default([]) + [[
          item.key,
          (item.value.pdbNodeLevelDetails.values()
           | selectattr('openMode', 'equalto', 'READ_WRITE') | list | length > 0)
          | ternary('READ_WRITE', 'MOUNTED'),
          (item.value.pdbNodeLevelDetails.values()
           | selectattr('restricted', 'equalto', true) | list | length > 0)
          | ternary('YES', 'NO')
        ]]
      }}
  loop: "{{ _db.pdbs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# ==============================================================================
# Section 6 — Data Guard standby member details (sqlplus only — not in dbaascli)
# ==============================================================================

- name: "Topology | Query DG standby member details from v$dataguard_config"
  ansible.builtin.shell: |
    {{ oracle_env }}
    sqlplus -s /nolog <<EOF
    {{ sqlplus_preamble }}
    CONNECT {{ sqlplus_connect }}
    SELECT db_unique_name
           ||'|'|| role
           ||'|'|| enabled
    FROM   v\$dataguard_config
    ORDER BY role;
    EXIT;
    EOF
  register: _dg_members_raw
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: oracle
  changed_when: false
  failed_when: false
  no_log: true
  when: dg_detected | bool
  vars:
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='oracle') }}"

- name: "Topology | Parse DG standby member list"
  ansible.builtin.set_fact:
    dg_standby_members: >-
      {{
        _dg_members_raw.stdout_lines
        | default([])
        | select('match', '^[A-Z_]')
        | map('split', '|')
        | map('map', 'trim')
        | selectattr(1, 'ne', 'PRIMARY')
        | list
      }}
  when: dg_detected | bool

# ==============================================================================
# Section 7 — Commvault detection (OS-level checks, unchanged)
# ==============================================================================

- name: "Topology | Check Commvault registry path exists"
  ansible.builtin.stat:
    path: "{{ commvault_registry_path }}"
  register: commvault_registry_stat
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: root
  failed_when: false

- name: "Topology | Check for Commvault cvd process"
  ansible.builtin.shell: |
    pgrep -x {{ commvault_process_name }} > /dev/null 2>&1 && echo 'YES' || echo 'NO'
  register: commvault_process_raw
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: root
  changed_when: false
  failed_when: false

- name: "Topology | Check for Commvault simpana binary"
  ansible.builtin.stat:
    path: "/usr/bin/simpana"
  register: commvault_simpana_stat
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: root
  failed_when: false

- name: "Topology | Check RMAN backup history for SBT (Commvault) device type"
  ansible.builtin.shell: |
    {{ oracle_env }}
    sqlplus -s /nolog <<EOF
    {{ sqlplus_preamble }}
    CONNECT {{ sqlplus_connect }}
    SELECT NVL(MAX('YES'),'NO')
    FROM   v\$rman_backup_job_details
    WHERE  output_device_type = 'SBT_TAPE'
    AND    start_time > SYSDATE - 30;
    EXIT;
    EOF
  register: commvault_rman_raw
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: oracle
  changed_when: false
  failed_when: false
  no_log: true
  vars:
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='oracle') }}"

- name: "Topology | Set Commvault detected fact"
  ansible.builtin.set_fact:
    commvault_detected: >-
      {{
        commvault_registry_stat.stat.exists
        or (commvault_process_raw.stdout | default('NO') | trim == 'YES')
        or commvault_simpana_stat.stat.exists
        or (commvault_rman_raw.stdout | default('NO') | trim == 'YES')
        or (commvault_enabled | bool)
      }}

# ==============================================================================
# Section 8 — Topology summary
# ==============================================================================

- name: "Topology | Display detected topology"
  ansible.builtin.debug:
    msg:
      - "============================================="
      - " Topology Detection Summary"
      - "============================================="
      - "DB Name          : {{ db_name_actual }}"
      - "DB Unique Name   : {{ db_unique_name_actual }}"
      - "DB Role          : {{ db_role }}"
      - "DB Type          : {{ db_type }}"
      - "Oracle Version   : {{ oracle_version_full }}"
      - "Oracle Home      : {{ oracle_home }}"
      - "SCAN Address     : {{ scan_address }}"
      - "Port             : {{ oracle_port }}"
      - "Service          : {{ oracle_service }}"
      - "Data Guard       : {{ dg_detected }}"
      - "DG Standbys      : {{ dg_standby_members | default([]) | map(attribute=0) | list }}"
      - "Commvault        : {{ commvault_detected }}"
      - "RAC Nodes        : {{ rac_nodes | map(attribute='nodeName') | list }}"
      - "PDBs             : {{ pdb_list | map(attribute=0) | list }}"
      - "============================================="

- name: "Topology | Warn if DG detected but no standby members found"
  ansible.builtin.debug:
    msg: >
      WARNING: dgEnabled=true but no standby members returned from
      v$dataguard_config. The DG broker may not be active.
      Verify manually before proceeding.
  when:
    - dg_detected | bool
    - dg_standby_members | default([]) | length == 0
