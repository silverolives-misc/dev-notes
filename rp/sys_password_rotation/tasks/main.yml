---
# ------------------------------------------------------------------------------
# tasks/main.yml
# Role entry point — all phases wrapped in block/rescue so failures are
# captured for the end-of-run summary rather than silently dropped.
#
# Note: include_tasks (dynamic) is required here because import_tasks (static)
# cannot be used inside a block. Tag-based selective execution (--tags precheck
# etc.) applies to the include task itself, not the tasks within the file.
# ------------------------------------------------------------------------------

- block:

    - name: "Phase 1 | Vault pre-checks"
      ansible.builtin.include_tasks: precheck_vault.yml

    - name: "Phase 2 | Topology detection"
      ansible.builtin.include_tasks: detect_topology.yml

    - name: "Phase 3 | Oracle DB pre-checks"
      ansible.builtin.include_tasks: precheck_oracle.yml

    - name: "Phase 4 | Data Guard pre-checks"
      ansible.builtin.include_tasks: precheck_dataguard.yml
      when: dg_detected | default(false) | bool

    - name: "Phase 5 | Password policy pre-checks"
      ansible.builtin.include_tasks: precheck_password_policy.yml

    - name: "Phase 6 | Session and backup pre-checks"
      ansible.builtin.include_tasks: precheck_sessions.yml

    - name: "Phase 7 | Evaluate rotation requirement"
      ansible.builtin.include_tasks: evaluate_rotation.yml

    - name: "Phase 8 | Execute password rotation"
      ansible.builtin.include_tasks: rotate.yml
      when: rotation_required | default(false) | bool

    - name: "Phase 9 | Data Guard post-rotation actions"
      ansible.builtin.include_tasks: action_dataguard.yml
      when:
        - rotation_required | default(false) | bool
        - dg_detected | default(false) | bool

    - name: "Phase 10 | Commvault post-rotation actions"
      ansible.builtin.include_tasks: action_commvault.yml
      when:
        - rotation_required | default(false) | bool
        - commvault_detected | default(false) | bool

    - name: "Phase 11 | Post-rotation validation"
      ansible.builtin.include_tasks: post_validate.yml
      when: rotation_required | default(false) | bool

    - name: "Phase 12 | Record rotation success for summary"
      ansible.builtin.set_stats:
        data:
          rotation_summary: >-
            {{
              (rotation_summary | default({})) | combine({
                db_unique_name | default(inventory_hostname): {
                  'status':    'ROTATED' if (rotation_required | default(false) | bool) else 'SKIPPED',
                  'host':      ansible_host,
                  'vault_role': vault_role_name | default(''),
                  'node':      node_fqdn | default(''),
                  'db_role':   db_role | default('UNKNOWN'),
                  'dg':        dg_detected | default(false),
                  'commvault': commvault_detected | default(false),
                  'secret_age': secret_age_days | default(0)
                }
              })
            }}
        aggregate: true

  rescue:

    - name: "Record failure for end-of-run summary"
      ansible.builtin.set_stats:
        data:
          rotation_failures: >-
            {{
              (rotation_failures | default({})) | combine({
                db_unique_name | default(inventory_hostname): {
                  'host':        ansible_host | default(inventory_hostname),
                  'failed_task': ansible_failed_task.name | default('unknown'),
                  'error':       ansible_failed_result.msg
                                 | default(ansible_failed_result.stderr
                                 | default(ansible_failed_result.stdout
                                 | default('See playbook logs')))
                                 | regex_replace('\n', ' ')
                                 | truncate(120)
                }
              })
            }}
        aggregate: true
      no_log: true

    - name: "Re-fail host after recording failure"
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_task.name | default('unknown task') }}:
          {{ ansible_failed_result.msg | default('see logs') }}
