---
# ------------------------------------------------------------------------------
# post_validate.yml
# Verify rotation success — connect with new password, confirm Vault updated
# ------------------------------------------------------------------------------

- name: "Post-validate | Pause to allow password change to propagate"
  ansible.builtin.pause:
    seconds: 5

- name: "Post-validate | Test DB connectivity with new password"
  ansible.builtin.shell: |
    {{ oracle_env }}
    sqlplus -s /nolog <<EOF
    {{ sqlplus_preamble }}
    CONNECT sys/"{{ new_sys_password }}"@{{ scan_address }}:{{ oracle_port }}/{{ oracle_service }} as sysdba
    SELECT 'CONNECTION_OK' FROM dual;
    EXIT;
    EOF
  register: post_connect_check
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: oracle
  changed_when: false
  failed_when: false
  no_log: true
  vars:
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='oracle') }}"

- name: "Post-validate | Assert new password works"
  ansible.builtin.assert:
    that:
      - post_connect_check.rc == 0
      - "'CONNECTION_OK' in post_connect_check.stdout"
    fail_msg: >
      CRITICAL: Cannot connect with new password (RC={{ post_connect_check.rc }}).
      Old password still valid within rollover window.
      Check break-glass backup at {{ breakglass_backup_path }}.
    success_msg: "Successfully connected with new password."

- name: "Post-validate | Query SYS account status with new password"
  ansible.builtin.shell: |
    {{ oracle_env }}
    sqlplus -s /nolog <<EOF
    {{ sqlplus_preamble }}
    CONNECT sys/"{{ new_sys_password }}"@{{ scan_address }}:{{ oracle_port }}/{{ oracle_service }} as sysdba
    SELECT account_status FROM dba_users WHERE username = 'SYS';
    EXIT;
    EOF
  register: post_status_raw
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: oracle
  changed_when: false
  no_log: true
  vars:
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='oracle') }}"

- name: "Post-validate | Assert SYS account is still healthy"
  ansible.builtin.assert:
    that:
      - "'LOCKED' not in post_status_raw.stdout"
    fail_msg: >
      SYS account is locked post-rotation: {{ post_status_raw.stdout | trim }}.
    success_msg: "SYS account status post-rotation: {{ post_status_raw.stdout | trim }}."

# ------------------------------------------------------------------------------
# Read the role back from the custom static engine and confirm that
# current_version has incremented beyond vault_pre_rotation_version captured
# in precheck_vault.yml, confirming the password write was accepted.
# ------------------------------------------------------------------------------

- name: "Post-validate | GET role from Vault custom static engine"
  ansible.builtin.uri:
    url:            "{{ vault_engine_url }}/v1/{{ vault_engine_mount }}/role/{{ vault_role_name }}"
    method:         GET
    headers:
      X-Vault-Namespace: "{{ vault_namespace }}"
      X-Vault-Token:     "{{ login_token }}"
      accept:            application/json
    return_content: true
    status_code:    200
  register: vault_post_role
  no_log: true

- name: "Post-validate | Assert Vault version incremented after rotation"
  ansible.builtin.assert:
    that:
      - vault_post_role.status == 200
      - vault_post_role.json.data.current_version is defined
      - vault_post_role.json.data.current_version | int > vault_pre_rotation_version | int
    fail_msg: >
      Vault current_version did not increment after rotation.
      Pre-rotation: {{ vault_pre_rotation_version }},
      post-rotation: {{ vault_post_role.json.data.current_version | default('absent') }}.
      The password may not have been written to the engine successfully.
    success_msg: >
      Vault rotation confirmed: version incremented from
      {{ vault_pre_rotation_version }} to
      {{ vault_post_role.json.data.current_version }}.

- name: "Post-validate | Remove break-glass backup after confirmed success"
  ansible.builtin.file:
    path: "{{ breakglass_backup_path }}/{{ db_unique_name }}_sys_breakglass_{{ ansible_date_time.date }}.txt"
    state: absent
  become: true
  become_user: root
  delegate_to: "{{ node_fqdn }}"
  when: breakglass_backup_enabled | bool

- name: "Post-validate | Display final rotation summary"
  ansible.builtin.debug:
    msg:
      - "============================================="
      - " SYS Password Rotation Complete"
      - "============================================="
      - "Database        : {{ oracle_service }}"
      - "DB Unique Name  : {{ db_unique_name }}"
      - "Node            : {{ node_fqdn }}"
      - "SCAN            : {{ scan_address }}"
      - "DB Role         : {{ db_role }}"
      - "Oracle Version  : {{ oracle_version_full | default('unknown') }}"
      - "Account Status  : {{ post_status_raw.stdout | trim }}"
      - "DG Detected     : {{ dg_detected | default(false) }}"
      - "CV Detected     : {{ commvault_detected | default(false) }}"
      - "Vault Role      : {{ vault_role_name }}"
      - "Vault Engine    : {{ vault_engine_url }}/v1/{{ vault_engine_mount }}"
      - "Vault Version   : {{ vault_pre_rotation_version }} → {{ vault_post_role.json.data.current_version }}"
      - "Rotated At      : {{ vault_post_role.json.data.created_at | default(ansible_date_time.iso8601) }}"
      - "Rotated At      : {{ ansible_date_time.iso8601 }}"
      - "Rotated By      : {{ ansible_user_id }}"
      - "============================================="
      - "{% if commvault_detected | default(false) %}ACTION: Update Commvault credentials — see {{ commvault_notification_log }}{% endif %}"
      - "{% if dg_detected | default(false) %}DG standbys updated via dbaascli blob propagation{% endif %}"
      - "============================================="
