---
# ------------------------------------------------------------------------------
# precheck_vault.yml
# Validate connectivity to the custom Vault static database engine and confirm
# the role exists with the expected structure.
#
# current_oracle_password and secret_age_days are supplied as hostvars by the
# playbook (sourced from the role metadata GET in Phase 1).
#
# The pre-rotation GET captures created_at and current_version so
# post_validate.yml can confirm current_version incremented after write-back.
# ------------------------------------------------------------------------------

- name: "Vault Pre-check | Assert credential hostvars were supplied by playbook"
  ansible.builtin.assert:
    that:
      - current_oracle_password is defined
      - current_oracle_password | length > 0
      - secret_age_days is defined
      - login_token is defined
      - login_token | length > 0
      - vault_role_name is defined
    fail_msg: >
      One or more required Vault hostvars are missing (current_oracle_password,
      secret_age_days, login_token, vault_role_name).
      Ensure Phase 1 of the playbook completed successfully.
    success_msg: "Vault credential hostvars confirmed present."
  no_log: true

- name: "Vault Pre-check | Assert secret is not too new to rotate" # noqa: no-log-password
  ansible.builtin.assert:
    that:
      - secret_age_days | int >= password_min_age_days | int
    fail_msg: >
      Password was rotated only {{ secret_age_days }} days ago
      (minimum: {{ password_min_age_days }} days). Aborting to prevent
      double-rotation.
    success_msg: >
      Secret age {{ secret_age_days }} days meets minimum age requirement.

- name: "Vault Pre-check | GET role metadata from custom engine"
  ansible.builtin.uri:
    url:            "{{ vault_engine_url }}/v1/{{ vault_engine_mount }}/role/{{ vault_role_name }}"
    method:         GET
    headers:
      X-Vault-Namespace: "{{ vault_namespace }}"
      X-Vault-Token:     "{{ login_token }}"
      accept:            application/json
    return_content: true
    status_code:    200
  register: vault_role_meta
  no_log: true

- name: "Vault Pre-check | Assert role is reachable and has expected fields" # noqa: no-log-password
  ansible.builtin.assert:
    that:
      - vault_role_meta.status == 200
      - vault_role_meta.json.data is defined
      - vault_role_meta.json.data.username is defined
      - vault_role_meta.json.data.created_at is defined
      - vault_role_meta.json.data.current_version is defined
    fail_msg: >
      Cannot read role '{{ vault_role_name }}' from
      '{{ vault_engine_mount }}/role/{{ vault_role_name }}'.
      Check the engine mount and token permissions.
    success_msg: "Vault role '{{ vault_role_name }}' is reachable and valid."

- name: "Vault Pre-check | Capture pre-rotation version and timestamp"
  ansible.builtin.set_fact:
    vault_pre_rotation_timestamp: "{{ vault_role_meta.json.data.created_at }}"
    vault_pre_rotation_version:   "{{ vault_role_meta.json.data.current_version | int }}"

- name: "Vault Pre-check | Display rotation context" # noqa: no-log-password
  ansible.builtin.debug:
    msg:
      - "Vault role         : {{ vault_role_name }}"
      - "Oracle user        : {{ vault_role_meta.json.data.username }}"
      - "Current version    : {{ vault_role_meta.json.data.current_version }}"
      - "Last rotated       : {{ vault_role_meta.json.data.created_at }}"
      - "Secret age         : {{ secret_age_days }} days"
      - "Rotation threshold : {{ password_max_age_days }} days"
