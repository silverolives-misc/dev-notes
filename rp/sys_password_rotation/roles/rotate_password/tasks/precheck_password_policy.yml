---
# ------------------------------------------------------------------------------
# precheck_password_policy.yml
# Validate Oracle password profile settings for target_user
# ------------------------------------------------------------------------------

- name: "Policy Pre-check | Query {{ target_user }} password profile limits"
  ansible.builtin.shell: |
    {{ oracle_env }}
    sqlplus -s /nolog <<EOF
    {{ sqlplus_preamble }}
    CONNECT {{ sqlplus_connect }}
    SELECT resource_name ||'|'|| NVL(limit,'NULL')
    FROM   dba_profiles
    WHERE  profile       = '{{ account_profile }}'
    AND    resource_type = 'PASSWORD'
    ORDER BY resource_name;
    EXIT;
    EOF
  register: profile_raw
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: oracle
  changed_when: false
  no_log: true
  vars:
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='oracle') }}"

- name: "Policy Pre-check | Parse profile limits into dictionary"
  ansible.builtin.set_fact:
    profile_limits: >-
      {{
        profile_limits | default({}) | combine(
          { item.split('|')[0] | trim : item.split('|')[1] | trim }
        )
      }}
  loop: "{{ profile_raw.stdout_lines | select('match', '^[A-Z_]') | list }}"

- name: "Policy Pre-check | Display all password profile settings" # noqa: no-log-password
  ansible.builtin.debug:
    msg:
      - "Profile                 : {{ account_profile }}"
      - "PASSWORD_LIFE_TIME      : {{ profile_limits.PASSWORD_LIFE_TIME | default('N/A') }}"
      - "PASSWORD_GRACE_TIME     : {{ profile_limits.PASSWORD_GRACE_TIME | default('N/A') }}"
      - "PASSWORD_REUSE_TIME     : {{ profile_limits.PASSWORD_REUSE_TIME | default('N/A') }}"
      - "PASSWORD_REUSE_MAX      : {{ profile_limits.PASSWORD_REUSE_MAX | default('N/A') }}"
      - "PASSWORD_LOCK_TIME      : {{ profile_limits.PASSWORD_LOCK_TIME | default('N/A') }}"
      - "FAILED_LOGIN_ATTEMPTS   : {{ profile_limits.FAILED_LOGIN_ATTEMPTS | default('N/A') }}"
      - "PASSWORD_ROLLOVER_TIME  : {{ profile_limits.PASSWORD_ROLLOVER_TIME | default('NOT SET') }}"
      - "PASSWORD_VERIFY_FUNCTION: {{ profile_limits.PASSWORD_VERIFY_FUNCTION | default('NULL') }}"

- name: "Policy Pre-check | Assert PASSWORD_ROLLOVER_TIME is configured" # noqa: no-log-password
  ansible.builtin.assert:
    that:
      - profile_limits.PASSWORD_ROLLOVER_TIME is defined
      - profile_limits.PASSWORD_ROLLOVER_TIME not in ['0', 'NULL', 'UNLIMITED', 'DEFAULT']
      - profile_limits.PASSWORD_ROLLOVER_TIME | float >= min_rollover_time_days | float
    fail_msg: >
      PASSWORD_ROLLOVER_TIME is '{{ profile_limits.PASSWORD_ROLLOVER_TIME | default('NOT SET') }}'
      on profile '{{ account_profile }}'. Minimum required: {{ min_rollover_time_days }} days.
      Set with: ALTER PROFILE {{ account_profile }} LIMIT PASSWORD_ROLLOVER_TIME {{ min_rollover_time_days }};
    success_msg: >
      PASSWORD_ROLLOVER_TIME={{ profile_limits.PASSWORD_ROLLOVER_TIME }} days
      on profile '{{ account_profile }}'.
  when: min_rollover_time_days | float > 0

- name: "Policy Pre-check | Warn if version may not support PASSWORD_ROLLOVER_TIME"
  ansible.builtin.debug:
    msg: >
      WARNING: Oracle version {{ oracle_version_full }} detected (RU {{ oracle_version_full.split('.')[1] }}).
      PASSWORD_ROLLOVER_TIME requires 19c RU 19.12+ or Oracle 21c+.
      This database does not meet the minimum patch level — do not enable PASSWORD_ROLLOVER_TIME.
  when: >-
    oracle_major_version | int < 19
    or (oracle_major_version | int == 19 and
        oracle_version_full.split('.')[1] | int < 12)

- name: "Policy Pre-check | Check for rollover already in progress"
  ansible.builtin.shell: |
    {{ oracle_env }}
    sqlplus -s /nolog <<EOF
    {{ sqlplus_preamble }}
    CONNECT {{ sqlplus_connect }}
    SELECT NVL(MAX(account_status),'NONE')
    FROM   dba_users
    WHERE  username       = '{{ target_user | upper }}'
    AND    account_status LIKE '%ROLLOVER%';
    EXIT;
    EOF
  register: rollover_check_raw
  delegate_to: "{{ node_fqdn }}"
  become: true
  become_user: oracle
  changed_when: false
  no_log: true
  vars:
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=hostvars[inventory_hostname]['login_token'],
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='oracle') }}"

- name: "Policy Pre-check | Assert no rollover already in progress"
  ansible.builtin.assert:
    that:
      - rollover_check_raw.stdout | trim == 'NONE'
    fail_msg: >
      {{ target_user }} account is already IN ROLLOVER
      (status: {{ rollover_check_raw.stdout | trim }}).
      Wait for the existing rollover window to expire before rotating again.
    success_msg: "No existing rollover in progress for {{ target_user }}."
