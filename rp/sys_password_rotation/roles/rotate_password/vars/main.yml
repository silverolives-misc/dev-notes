---
# ------------------------------------------------------------------------------
# vars/main.yml
# Internal role variables — not intended to be overridden by users
# ------------------------------------------------------------------------------

# Standard sqlplus silent preamble used in all shell tasks
sqlplus_preamble: |
  WHENEVER SQLERROR EXIT SQL.SQLCODE
  WHENEVER OSERROR  EXIT 1
  SET PAGESIZE     0
  SET FEEDBACK     OFF
  SET HEADING      OFF
  SET ECHO         OFF
  SET TRIMSPOOL    ON
  SET LINESIZE     4000
  SET DEFINE       OFF
  SET COLSEP       '|'
  SET NULL         'NULL'

# Oracle environment — source the per-database env file present on ExaCC hosts
oracle_env: ". /home/oracle/{{ db_unique_name_actual }}.env"

# sqlplus connect string — OS authentication via ORACLE_SID set by env file
# No password required; oracle OS user in dba group grants sysdba access locally
sqlplus_connect: "/ as sysdba"
