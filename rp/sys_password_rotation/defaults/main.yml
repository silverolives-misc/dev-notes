---
# ------------------------------------------------------------------------------
# defaults/main.yml
# All user-configurable variables with safe defaults
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Vault custom static database secrets engine
# ------------------------------------------------------------------------------
vault_engine_url:       ""                            # e.g. https://vault.example.com:8200
vault_engine_mount:     "secrets/static-database"     # custom engine mount point
vault_namespace:        ""                            # X-Vault-Namespace header value
vault_token_ttl:        "6h"                          # TTL for the login token

# ------------------------------------------------------------------------------
# Large-estate tuning (Phase 1 discovery)
# ------------------------------------------------------------------------------

# Max simultaneous Vault API calls during metadata reads.
# throttle: limits the number of in-flight HTTP requests to Vault.
# Increase if Vault can handle higher concurrency; decrease to protect Vault.
vault_api_concurrency: 25

# Rotation parallelism in Phase 2 (maps to Ansible serial:).
# DG standbys are excluded at discovery, so raising this is safe for Oracle.
# Cap at the ansible.cfg 'forks' value. Accepts integers or percentages ("10%").
rotation_serial: 1

# ------------------------------------------------------------------------------
# Rotation policy
# ------------------------------------------------------------------------------
password_max_age_days:    90
password_min_age_days:    1
password_length:          20

# Minimum PASSWORD_ROLLOVER_TIME expected (days). 1/24 = 1 hour.
min_rollover_time_days: "{{ 1 / 24 }}"

# ------------------------------------------------------------------------------
# Oracle connection — scan_address, oracle_port, oracle_service and oracle_home
# are set dynamically by detect_topology.yml from dbaascli database getDetails.
# The values here are fallback defaults only.
# ------------------------------------------------------------------------------
oracle_port:    1521
oracle_service: "{{ db_unique_name }}"
oracle_home:    "/u01/app/oracle/product/19.0.0.0/dbhome_1"

# dbaascli
dbaascli_path: "/usr/local/bin/dbaascli"

# ------------------------------------------------------------------------------
# Pre-check thresholds
# ------------------------------------------------------------------------------
dg_max_lag_seconds:           300
sys_session_warning_threshold: 5
fail_on_active_rman:          true

# ------------------------------------------------------------------------------
# Topology overrides
# Auto-detected via dbaascli — can be forced via extra-vars if needed
# ------------------------------------------------------------------------------
dg_enabled:        false
commvault_enabled: false

# ------------------------------------------------------------------------------
# Commvault settings
# ------------------------------------------------------------------------------
commvault_registry_path:    "/etc/CommVaultRegistry"
commvault_process_name:     "cvd"
commvault_ora_user:         "sysbackup"
commvault_notify_only:      true
commvault_notification_log: "/var/log/ansible/commvault_rotation_notice.log"

# ------------------------------------------------------------------------------
# Break-glass
# ------------------------------------------------------------------------------
breakglass_backup_enabled: true
breakglass_backup_path:    "/etc/oracle/breakglass"

# ------------------------------------------------------------------------------
# Notifications
# ------------------------------------------------------------------------------
notify_on_skip:    true
notify_on_success: true
notify_on_failure: true
