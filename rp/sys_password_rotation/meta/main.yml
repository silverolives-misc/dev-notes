---
galaxy_info:
  role_name: sys_password_rotation
  author: your_team
  description: >
    SYS password rotation for Oracle databases on ExaCC.
    Detects topology (Data Guard, Commvault) and takes appropriate
    action for each. Stores passwords in HashiCorp Vault KV2 and
    uses secret metadata to determine if rotation is required.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - "8"
        - "9"

dependencies:
  - community.hashi_vault
