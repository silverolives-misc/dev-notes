---
galaxy_info:
  role_name: sys_password_rotation
  author: your_team
  description: >
    SYS password rotation for Oracle databases on ExaCC.
    Detects topology (Data Guard, Commvault) and takes appropriate
    action for each. Stores passwords in a custom HashiCorp Vault
    static database secrets engine via ansible.builtin.uri.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - "8"
        - "9"

dependencies:
  - community.general
