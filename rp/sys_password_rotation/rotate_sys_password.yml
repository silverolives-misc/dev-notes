---
# ------------------------------------------------------------------------------
# rotate_sys_password.yml
# Vault-driven SYS password rotation playbook for ExaCC estate
# Reads all DB entries from Vault, builds in-memory inventory,
# then runs the rotation role against all databases requiring rotation.
# ------------------------------------------------------------------------------
#
# Usage:
#   ansible-playbook rotate_sys_password.yml
#
# Tags:
#   --tags precheck          Run all pre-checks only (no changes)
#   --tags detect_topology   Topology detection only
#   --tags rotate            Rotation tasks only
#   --tags action_dg         Data Guard actions only
#   --tags action_commvault  Commvault actions only
#   --tags validate          Post-validation only
#
# Environment variables:
#   VAULT_ROLE_ID    — AppRole role ID
#   VAULT_SECRET_ID  — AppRole secret ID
#
# ------------------------------------------------------------------------------

- name: "Phase 1 | Read Vault estate and build in-memory inventory"
  hosts: localhost
  gather_facts: true
  vars:
    vault_url: "https://vault.example.com:8200"
    vault_auth_method: "approle"
    vault_mount_point: "secret"
    vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
    vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') }}"
    password_max_age_days: 90

    # List all Vault paths covering the full estate
    vault_estate_paths:
      - "prod/exacc/uk-london-1"
      - "prod/exacc/eu-frankfurt-1"
      - "nonprod/exacc/uk-london-1"
      - "dr/exacc/eu-frankfurt-1"

  tasks:

    - name: "Vault | List all DB paths for each estate segment"
      community.hashi_vault.vault_list:
        url: "{{ vault_url }}"
        path: "{{ vault_mount_point }}/metadata/{{ item }}"
        auth_method: "{{ vault_auth_method }}"
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
      loop: "{{ vault_estate_paths }}"
      register: vault_path_lists
      failed_when: false
      no_log: true

    - name: "Vault | Build flat list of all secret paths"
      ansible.builtin.set_fact:
        all_secret_paths: >-
          {{
            all_secret_paths | default([]) +
            (item.data.keys | default([])
            | map('regex_replace', '^(.*)$', estate_path + '/\\1/sys')
            | list)
          }}
      loop: "{{ vault_path_lists.results }}"
      loop_control:
        index_var: idx
      vars:
        estate_path: "{{ vault_estate_paths[idx] }}"
      when: item.data is defined

    - name: "Vault | Read metadata and payload for each DB"
      community.hashi_vault.vault_read:
        url: "{{ vault_url }}"
        path: "{{ vault_mount_point }}/data/{{ item }}"
        auth_method: "{{ vault_auth_method }}"
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
      loop: "{{ all_secret_paths | default([]) }}"
      register: vault_db_secrets
      no_log: true

    - name: "Vault | Build in-memory inventory for DBs requiring rotation"
      ansible.builtin.add_host:
        name: "{{ item.data.data.node_fqdn }}"
        groups: rotation_targets
        # Connection details (sourced from Vault payload)
        db_unique_name: "{{ item.data.data.db_unique_name }}"
        db_role_vault: "{{ item.data.data.db_role }}"
        scan_address: "{{ item.data.data.scan_address }}"
        node_fqdn: "{{ item.data.data.node_fqdn }}"
        oracle_service: "{{ item.data.data.db_unique_name }}"
        current_sys_password: "{{ item.data.data.password }}"
        # Vault context
        vault_secret_path: "{{ all_secret_paths[idx] }}"
        vault_secret_current_version: "{{ item.data.metadata.current_version }}"
        vault_secret_updated_time: "{{ item.data.metadata.updated_time }}"
        secret_age_days: >-
          {{
            ((ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
            - (item.data.metadata.updated_time | regex_replace('\\..*Z$','Z')
            | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).days
          }}
      loop: "{{ vault_db_secrets.results }}"
      loop_control:
        index_var: idx
      when:
        - item.data is defined
        - item.data.data.db_role == 'PRIMARY'
        - >-
          ((ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
          - (item.data.metadata.updated_time | regex_replace('\\..*Z$','Z')
          | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).days | int >= password_max_age_days | int
      no_log: true

    - name: "Vault | Display rotation candidates"
      ansible.builtin.debug:
        msg: "Rotation candidates: {{ groups['rotation_targets'] | default([]) }}"

- name: "Phase 2 | Run rotation role against in-memory inventory"
  hosts: rotation_targets
  gather_facts: false
  vars:
    vault_url: "https://vault.example.com:8200"
    vault_auth_method: "approle"
    vault_mount_point: "secret"
    vault_role_id: "{{ lookup('env', 'VAULT_ROLE_ID') }}"
    vault_secret_id: "{{ lookup('env', 'VAULT_SECRET_ID') }}"
    oracle_home: "/u01/app/oracle/product/19.0.0/dbhome_1"
    oracle_port: 1521
    password_max_age_days: 90
    password_min_age_days: 1
    password_length: 20
    min_rollover_time_days: "{{ 1 / 24 }}"
    fail_on_active_rman: true
    breakglass_backup_enabled: true
    breakglass_backup_path: "/etc/oracle/breakglass"
    commvault_notify_only: true
    dbaascli_path: "/usr/local/bin/dbaascli"
  roles:
    - sys_password_rotation
