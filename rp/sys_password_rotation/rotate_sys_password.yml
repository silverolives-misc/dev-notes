---
# ------------------------------------------------------------------------------
# rotate_sys_password.yml
# Custom static database secrets engine driven SYS password rotation.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ PHASE 1 — localhost                                                     │
# │   Vault auth → list all roles → parallel metadata reads (bounded) →     │
# │   build _db_inventory with age and cluster_key →                        │
# │   fetch credentials for overdue candidates → build _verify_candidates   │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ PHASE 1.5 — _verify_candidates                                          │
# │   Parallel dbaascli database getDetails on every overdue candidate      │
# │   Confirms live PRIMARY role; detects post-failover state               │
# │   Only confirmed PRIMARYs enter rotation_targets                        │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ PHASE 2 — rotation_targets                                              │
# │   Execute sys_password_rotation role; serial controls parallelism.      │
# │   Standbys excluded at Phase 1.5 — DG-safe at any serial value.         │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Required environment variables:
#   _CLIENT__HASHI_URL        Vault address
#   _CLIENT__HASHI_NAMESPACE  Vault namespace
#   _CLIENT__HASHI_ROLE       Vault role for token login
#
# Key extra-vars:
#   target_user             SYS         Oracle user to rotate
#   password_max_age_days   90          rotation threshold in days
#   rotation_serial         1           Phase 2 parallelism (int or "10%")
#   vault_api_concurrency   25          max concurrent Vault API calls in Phase 1
#
# Usage:
#   ansible-playbook rotate_sys_password.yml -e environment=prod
#   ansible-playbook rotate_sys_password.yml -e environment=prod -e rotation_serial="10%"
# ------------------------------------------------------------------------------

# ==============================================================================
# Phase 1 | Discover databases and build in-memory inventory
# ==============================================================================

- name: "Discover | Build in-memory inventory from Vault static Oracle roles"
  hosts: localhost
  gather_facts: true
  vars:
    target_user:           "SYS"
    password_max_age_days: 90
    ssh_user:              "ans_oracle"
    vault_engine_mount:    "secrets/static-database"

    # Max simultaneous Vault API calls.
    vault_api_concurrency: 25

  tasks:

    # --------------------------------------------------------------------------
    # Step 1 — Vault authentication
    # --------------------------------------------------------------------------

    - name: "Discover | Obtain Vault login token"
      ansible.builtin.set_fact:
        vault_url:       "{{ lookup('env', '_CLIENT__HASHI_URL') | regex_replace('(.*)/v1$', '\\1') }}"
        vault_namespace: "{{ lookup('env', '_CLIENT__HASHI_NAMESPACE') }}"
        login_token:     "{{ lookup('_client_.epe.hashi_vault_login_token', token_ttl=vault_token_ttl | default('6h')) }}"
      no_log: true

    - name: "Discover | Assert Vault connection details are set"
      ansible.builtin.assert:
        that:
          - vault_url | length > 0
          - vault_namespace | length > 0
          - login_token | length > 0
        fail_msg: >
          _CLIENT__HASHI_URL or _CLIENT__HASHI_NAMESPACE environment variables are not set,
          or Vault login token could not be obtained.

    # --------------------------------------------------------------------------
    # Step 2 — List all roles (single GET)
    # --------------------------------------------------------------------------

    - name: "Discover | List all static database roles from Vault"
      ansible.builtin.uri:
        url:            "{{ vault_url }}/v1/{{ vault_engine_mount }}/role?list=true"
        method:         GET
        headers:
          X-Vault-Namespace: "{{ vault_namespace }}"
          X-Vault-Token:     "{{ login_token }}"
          accept:            application/json
        return_content: true
        status_code:    200
      register: _static_roles_raw
      no_log: true

    - name: "Discover | Assert roles were returned"
      ansible.builtin.assert:
        that:
          - _static_roles_raw.json.data['keys'] | default([]) | length > 0
        fail_msg: >
          No roles found at '{{ vault_engine_mount }}/role'.
          Check the mount point and token permissions.
        success_msg: >
          Found {{ _static_roles_raw.json.data['keys'] | length }} total role(s) in engine.

    # --------------------------------------------------------------------------
    # Step 3 — Filter to target user
    # --------------------------------------------------------------------------

    - name: "Discover | Filter roles for target user '{{ target_user }}'"
      ansible.builtin.set_fact:
        _target_role_names: >-
          {{
            _static_roles_raw.json.data['keys']
            | select('match', '^' + target_user + '_.*_EXACC$')
            | list
          }}

    - name: "Discover | Assert at least one matching role found"
      ansible.builtin.assert:
        that:
          - _target_role_names | length > 0
        fail_msg: >
          No roles matching '{{ target_user }}_*_EXACC' found.
          Check target_user (current: '{{ target_user }}') and engine mount.
        success_msg: >
          {{ _target_role_names | length }} '{{ target_user }}' role(s) to inspect.

    # --------------------------------------------------------------------------
    # Step 4 — Read all role metadata with bounded concurrency
    #
    # throttle: limits simultaneous in-flight Vault HTTP calls to prevent burst
    # against the Vault cluster across a large estate.
    # async: 60 / poll: 0 fires each call without blocking.
    # A calculated pause then lets most jobs finish before the polling loop runs,
    # avoiding sequential async_status round-trips for already-complete jobs.
    # --------------------------------------------------------------------------

    - name: "Discover | Read all role metadata (max {{ vault_api_concurrency }} concurrent)"
      ansible.builtin.uri:
        url:            "{{ vault_url }}/v1/{{ vault_engine_mount }}/role/{{ item }}"
        method:         GET
        headers:
          X-Vault-Namespace: "{{ vault_namespace }}"
          X-Vault-Token:     "{{ login_token }}"
          accept:            application/json
        return_content: true
        status_code:    200
      loop:     "{{ _target_role_names }}"
      loop_control:
        label: "{{ item }}"
      throttle: "{{ vault_api_concurrency | int }}"
      async:    60
      poll:     0
      register: _metadata_jobs
      no_log:   true

    - name: "Discover | Allow time for metadata reads to settle"
      ansible.builtin.pause:
        seconds: "{{ [(_target_role_names | length / vault_api_concurrency | int) | int * 2, 5] | max }}"

    - name: "Discover | Collect all metadata read results"
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ _metadata_jobs.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: _metadata_results
      until:    _metadata_results is finished
      retries:  20
      delay:    3
      no_log:   true

    # --------------------------------------------------------------------------
    # Step 5 — Parse /role/ metadata into _db_inventory
    #
    # The /role/ endpoint returns: created_at, current_version, username, name.
    # It does NOT return connection_url or password — those come from /cred/.
    # created_at is the timestamp of the last password write and is used as
    # the rotation age marker (equivalent to last_vault_rotation).
    # --------------------------------------------------------------------------

    - name: "Discover | Parse role metadata into inventory records"
      ansible.builtin.set_fact:
        _db_inventory: >-
          {{
            _db_inventory | default([]) + [{
              'role_name':       item[0],
              'oracle_user':     item[0].split('_')[0],
              'db_unique_name':  item[0].split('_')[1:-1] | join('_'),
              'oracle_db_name':  item[0].split('_')[1:-1] | join('_'),
              'username':        item[1].json.data.username,
              'created_at':      item[1].json.data.created_at | default(''),
              'current_version': item[1].json.data.current_version | default(0) | int,
              'secret_age_days':
                ((ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
                 - (item[1].json.data.created_at
                    | default(ansible_date_time.iso8601)
                    | regex_replace('\\.\\d+Z$', 'Z')
                    | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
                ).total_seconds() / 86400,
            }]
          }}
      loop: "{{ _target_role_names | zip(_metadata_results.results) | list }}"
      loop_control:
        label: "{{ item[0] }}"
      no_log: true

    # --------------------------------------------------------------------------
    # Step 6 — Estate summary (metadata pass — no connection data yet)
    # --------------------------------------------------------------------------

    - name: "Discover | Summarise estate — age and rotation status"
      ansible.builtin.debug:
        msg: >-
          {{ item.db_unique_name }}
          age={{ '%5.1f' | format(item.secret_age_days | float) }}d
          v{{ item.current_version }}
          {%- if item.secret_age_days | float >= password_max_age_days | float %}  ROTATE
          {%- else %}  ok ({{ (password_max_age_days | float - item.secret_age_days | float) | int }}d left)
          {%- endif %}
          [live check pending]
      loop: "{{ _db_inventory | sort(attribute='db_unique_name') }}"
      loop_control:
        label: "{{ item.db_unique_name }}"

    # --------------------------------------------------------------------------
    # Step 7 — Fetch credentials for overdue candidates only (/cred/ endpoint)
    #
    # The /cred/ endpoint returns connection_url and password.
    # We only call it for overdue candidates — avoids exposing credentials for
    # the entire estate when only a fraction need rotating.
    #
    # connection_url for SYS_*_EXACC roles is a comma-separated hostname list:
    #   "gbxccwg9033.systems.uk._client_,gbxccwg9034.systems.uk._client_"
    # oracle_port and oracle_service are not in the cred data; they are set
    # authoritatively by detect_topology.yml (dbaascli) in Phase 2.
    # --------------------------------------------------------------------------

    - name: "Discover | Identify overdue candidates for credential fetch"
      ansible.builtin.set_fact:
        _overdue_role_names: >-
          {{
            _db_inventory
            | selectattr('secret_age_days', 'ge', password_max_age_days | float)
            | map(attribute='role_name') | list
          }}

    - name: "Discover | Fetch credentials for {{ _overdue_role_names | length }} overdue candidate(s) via /cred/"
      ansible.builtin.uri:
        url:            "{{ vault_url }}/v1/{{ vault_engine_mount }}/cred/{{ item }}"
        method:         GET
        headers:
          X-Vault-Namespace: "{{ vault_namespace }}"
          X-Vault-Token:     "{{ login_token }}"
          accept:            application/json
        return_content: true
        status_code:    200
      loop:     "{{ _overdue_role_names }}"
      loop_control:
        label: "{{ item }}"
      throttle: "{{ vault_api_concurrency | int }}"
      async:    60
      poll:     0
      register: _cred_jobs
      no_log:   true

    - name: "Discover | Collect credential fetch results"
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ _cred_jobs.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      register: _cred_results
      until:    _cred_results is finished
      retries:  20
      delay:    3
      no_log:   true
      when: _overdue_role_names | length > 0

    # --------------------------------------------------------------------------
    # Step 8 — Build _rotation_candidates with full connection data
    #
    # Merges /role/ metadata (_db_inventory) with /cred/ data.
    #
    # connection_url for SYS_*_EXACC roles is a comma-separated list of
    # ExaCC cluster hostnames (not a TNS descriptor):
    #   "gbxccwg9033.systems.uk._client_,gbxccwg9034.systems.uk._client_"
    #
    #   node_fqdn     — first hostname; SSH target for dbaascli execution
    #   exacc_members — all hostnames; used for DG blob propagation targeting
    #   cluster_key   — sorted hosts joined; DG pairs on the same cluster share
    #                   the same key (used to detect paired roles)
    #
    # oracle_port and oracle_service are NOT in connection_url for this format.
    # They are set authoritatively by detect_topology.yml (dbaascli) in Phase 2.
    # --------------------------------------------------------------------------

    - name: "Discover | Build rotation candidates from metadata + credentials"
      ansible.builtin.set_fact:
        _rotation_candidates: >-
          {{
            _rotation_candidates | default([]) + [{
              'role_name':            item[0],
              'oracle_user':          _meta.oracle_user,
              'db_unique_name':       _meta.db_unique_name,
              'oracle_db_name':       _meta.oracle_db_name,
              'username':             _meta.username,
              'created_at':           _meta.created_at,
              'current_version':      _meta.current_version,
              'secret_age_days':      _meta.secret_age_days,
              'current_sys_password': item[1].json.data.password | default(''),
              'exacc_members':
                (item[1].json.data.connection_url.split(',') | map('trim') | list),
              'node_fqdn':
                (item[1].json.data.connection_url.split(',')[0] | trim),
              'cluster_key':
                (item[1].json.data.connection_url.split(',') | map('trim') | list | sort | join('|')),
            }]
          }}
      vars:
        _meta: "{{ _db_inventory | selectattr('role_name', 'equalto', item[0]) | first }}"
      loop: "{{ _overdue_role_names | zip(_cred_results.results) | list }}"
      loop_control:
        label: "{{ item[0] }}"
      no_log: true
      when: _overdue_role_names | length > 0

    # --------------------------------------------------------------------------
    # Step 9 — Populate _verify_candidates for Phase 1.5 live role check
    # --------------------------------------------------------------------------

    - name: "Discover | Add rotation candidates to _verify_candidates"
      ansible.builtin.add_host:
        name:   "{{ item.db_unique_name }}"
        groups: _verify_candidates
        ansible_host:         "{{ item.node_fqdn }}"
        ansible_user:         "{{ ssh_user }}"
        db_unique_name:       "{{ item.db_unique_name }}"
        oracle_db_name:       "{{ item.oracle_db_name }}"
        node_fqdn:            "{{ item.node_fqdn }}"
        exacc_members:        "{{ item.exacc_members }}"
        current_sys_password: "{{ item.current_sys_password }}"
        secret_age_days:      "{{ item.secret_age_days }}"
        created_at:           "{{ item.created_at }}"
        current_version:      "{{ item.current_version }}"
        vault_role_name:      "{{ item.role_name }}"
        vault_engine_url:     "{{ vault_url }}"
        vault_engine_mount:   "{{ vault_engine_mount }}"
        vault_namespace:      "{{ vault_namespace }}"
        login_token:          "{{ login_token }}"
        environment:          "{{ environment | default('prod') }}"
      loop: "{{ _rotation_candidates | default([]) }}"
      loop_control:
        label: "{{ item.db_unique_name }}"
      no_log: true

    - name: "Discover | Rotation queue summary"
      ansible.builtin.debug:
        msg:
          - "Estate total       : {{ _db_inventory | length }} roles"
          - "Overdue candidates : {{ _rotation_candidates | default([]) | length }} (pending Phase 1.5 live check)"


# ==============================================================================
# Phase 1.5 | Live database role verification via dbaascli
#
# Runs against all overdue candidates (_verify_candidates). Confirms the live
# PRIMARY role via dbaascli before adding hosts to rotation_targets.
# Handles post-failover state (old standby promoted, old primary demoted).
#
# serial: verify_serial (default 10) — OTP credentials are fetched in the first
# task of each batch, immediately before the SSH connection is opened.
# Batching avoids expiry races while keeping verification fast at scale.
#
# Detection outcomes displayed per host:
#   PRIMARY  — confirmed live PRIMARY; queued for rotation
#   STANDBY  — live standby; excluded (password managed via primary blob)
#   UNKNOWN  — dbaascli failed; host excluded with warning
# ==============================================================================

- name: "Verify | Confirm live database roles via dbaascli"
  hosts: _verify_candidates
  gather_facts: false
  serial: "{{ verify_serial | default(10) }}"
  remote_user: ans_oracle
  become: true
  become_user: root
  become_method: ansible.builtin.su
  vars:
    dbaascli_path: "/usr/local/bin/dbaascli"
    ansible_ssh_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=login_token,
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='ans_oracle') }}"
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=login_token,
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='root') }}"

  tasks:

    # --------------------------------------------------------------------------
    # Run dbaascli database getDetails on each candidate.
    # ignore_errors: true — unreachable or errored hosts are excluded with a
    # warning rather than aborting the entire verification sweep.
    # --------------------------------------------------------------------------

    - name: "Verify | Run dbaascli database getDetails"
      ansible.builtin.command:
        cmd: "{{ dbaascli_path }} database getDetails --dbname {{ oracle_db_name }}"
      register: _verify_dbaascli_raw
      changed_when: false
      ignore_errors: true
      no_log: true

    - name: "Verify | Parse live dbRole from dbaascli JSON"
      ansible.builtin.set_fact:
        _live_db_role: >-
          {{
            (
              _verify_dbaascli_raw.stdout
              | regex_search('(?s)(\{.*\})', '\1')
              | first
              | from_json
            ).dbRole | default('UNKNOWN')
          }}
      when:
        - _verify_dbaascli_raw is succeeded
        - _verify_dbaascli_raw.stdout | length > 0
      ignore_errors: true

    - name: "Verify | Default role to UNKNOWN on dbaascli error"
      ansible.builtin.set_fact:
        _live_db_role: "UNKNOWN"
      when: >-
        _verify_dbaascli_raw is failed
        or _verify_dbaascli_raw.stdout | length == 0
        or _live_db_role is not defined

    # --------------------------------------------------------------------------
    # Report — show hint vs live role, flag mismatches prominently
    # --------------------------------------------------------------------------

    - name: "Verify | Report live role classification"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          live={{ _live_db_role }}
          {%- if _live_db_role == 'UNKNOWN' %}
            WARNING — dbaascli failed; host excluded from rotation
          {%- elif _live_db_role == 'PRIMARY' %}
            ok — queuing for rotation
          {%- else %}
            ok — standby; excluded from rotation
          {%- endif %}

    # --------------------------------------------------------------------------
    # Gate: add confirmed PRIMARYs to rotation_targets.
    # Hosts where _live_db_role is not PRIMARY (STANDBY, UNKNOWN, error) are
    # simply not added — no assertion failure, no play abort.
    # The existing hostvars set in Phase 1 are preserved on the host object;
    # add_host with just name+group inherits them automatically.
    # --------------------------------------------------------------------------

    - name: "Verify | Add confirmed PRIMARYs to rotation_targets"
      ansible.builtin.add_host:
        name:   "{{ inventory_hostname }}"
        groups: rotation_targets
      when: _live_db_role | upper == 'PRIMARY'

    - name: "Verify | Warn on excluded candidates"
      ansible.builtin.debug:
        msg: >
          WARNING: {{ inventory_hostname }} excluded from rotation.
          Live role={{ _live_db_role }}.
          {% if _live_db_role == 'UNKNOWN' %}
          dbaascli failed — investigate connectivity before next run.
          {% elif _live_db_role != 'PRIMARY' %}
          This is a {{ _live_db_role }}. Its password is managed via primary
          rotation blob propagation. If unexpected, check DG topology.
          {% endif %}
      when: _live_db_role | upper != 'PRIMARY'

    - name: "Verify | Display verified rotation queue"
      ansible.builtin.debug:
        msg:
          - "Verified rotation targets: {{ groups['rotation_targets'] | default([]) | length }}"
          - "Targets: {{ groups['rotation_targets'] | default([]) | join(', ') | default('none') }}"
      run_once: true


# ==============================================================================
# Phase 2 | Execute SYS password rotation against confirmed primaries
#
# rotation_targets contains only live PRIMARYs confirmed by Phase 1.5 dbaascli.
# precheck_oracle.yml's db_role == PRIMARY assertion is a second safety net.
#
# Parallelism:
#   Because standbys are excluded before Phase 2 starts, there are no
#   DG pair conflicts regardless of serial value.
#   Cap serial at ansible.cfg forks= (use -f N to raise the limit).
#   rotation_serial: "10%"  is a good starting point for a large estate.
#
# max_fail_percentage: 0
#   If any single DB fails (e.g., Oracle changed but Vault write failed),
#   the play stops immediately. A partial failure state (DB password changed
#   but Vault out of sync) is critical — stopping prevents further DBs
#   entering the same state while the operator investigates.
#   Override with -e rotation_max_fail_pct=100 to continue on failures.
# ==============================================================================

- name: "Rotate | Execute SYS password rotation for all confirmed primary candidates"
  hosts: rotation_targets
  gather_facts: true
  serial: "{{ rotation_serial | default(1) }}"
  max_fail_percentage: "{{ rotation_max_fail_pct | default(0) }}"
  remote_user: ans_oracle
  become: true
  become_user: root
  become_method: ansible.builtin.su
  vars:
    ansible_ssh_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=login_token,
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='ans_oracle') }}"
    ansible_become_pass: "{{ lookup('_client_.epe.ssh_otp', ansible_host,
        login_token=login_token,
        ssh_role=lookup('env', '_CLIENT__HASHI_ROLE'),
        account='root') }}"
    password_max_age_days:      "{{ password_max_age_days | default(90) }}"
    password_min_age_days:      1
    password_length:            20
    min_rollover_time_days:     "{{ 1 / 24 }}"
    dbaascli_path:              "/usr/local/bin/dbaascli"
    dg_max_lag_seconds:         300
    fail_on_active_rman:        true
    breakglass_backup_enabled:  true
    breakglass_backup_path:     "/etc/oracle/breakglass"
    commvault_notify_only:      true
    commvault_notification_log: "/var/log/ansible/commvault_rotation_notice.log"
  roles:
    - role: sys_password_rotation
