---
# ------------------------------------------------------------------------------
# rotate_sys_password.yml
# Custom static database secrets engine driven SYS password rotation.
#
# Phase 1 — Runs on localhost:
#   1. Obtains a Vault login token via the custom lookup plugin
#   2. Lists all roles from the custom static database engine
#   3. Filters to the target Oracle user (default: SYS)
#      Role name format: <USER>_<DB_UNIQUE_NAME>_EXACC
#      e.g. SYS_FINDB_EXACC
#   4. Reads all role metadata in parallel (async)
#      Each role provides: username, connection_url (comma-separated ExaCC hosts),
#      last_vault_rotation, rotation_period, ttl
#   5. Derives secret_age_days from last_vault_rotation
#   6. Pre-filters to rotation candidates only
#   7. Adds one host per DB to the in-memory 'rotation_targets' group
#
# Phase 2 — Runs against rotation_targets:
#   Executes the sys_password_rotation role (serial: 1 by default)
#
# Required environment variables:
#   CLIENT_HASHI_URL        Vault address
#   CLIENT_HASHI_NAMESPACE  Vault namespace
#   CLIENT_HASHI_ROLE       Vault role for token login
#
# Optional extra-vars:
#   target_user           Oracle user to filter roles for (default: SYS)
#   password_max_age_days Rotation threshold in days      (default: 90)
#   ssh_user              OS user for Ansible SSH         (default: opc)
#   rotation_serial       DBs to rotate in parallel       (default: 1)
#
# Usage:
#   ansible-playbook rotate_sys_password.yml \
#     -e environment=prod
#
# Tags:
#   precheck            All pre-checks only (no changes)
#   rotate              Rotation tasks only
#   validate            Post-validation only
#   action_dg           Data Guard post-rotation actions
#   action_commvault    Commvault post-rotation actions
# ------------------------------------------------------------------------------

# ==============================================================================
# Phase 1 | Discover databases and build in-memory inventory
# ==============================================================================

- name: "Discover | Build in-memory inventory from Vault static Oracle roles"
  hosts: localhost
  gather_facts: true
  vars:
    target_user:          "SYS"
    password_max_age_days: 90
    ssh_user:             "opc"
    vault_engine_mount:   "secrets/static-database"

  tasks:

    # --------------------------------------------------------------------------
    # Step 1 — Vault authentication via custom lookup plugin
    # --------------------------------------------------------------------------

    - name: "Discover | Obtain Vault login token"
      ansible.builtin.set_fact:
        vault_url:       "{{ lookup('env', 'CLIENT_HASHI_URL') | regex_replace('(.*)/v1$', '\\1') }}"
        vault_namespace: "{{ lookup('env', 'CLIENT_HASHI_NAMESPACE') }}"
        login_token:     "{{ lookup('client.epe.hashi_vault_login_token', token_ttl=vault_token_ttl | default('6h')) }}"
      no_log: true

    - name: "Discover | Assert Vault connection details are set"
      ansible.builtin.assert:
        that:
          - vault_url | length > 0
          - vault_namespace | length > 0
          - login_token | length > 0
        fail_msg: >
          CLIENT_HASHI_URL or CLIENT_HASHI_NAMESPACE environment variables are not set,
          or Vault login token could not be obtained.

    # --------------------------------------------------------------------------
    # Step 2 — List all roles from the custom static database engine
    # --------------------------------------------------------------------------

    - name: "Discover | List static database roles from Vault"
      ansible.builtin.uri:
        url:            "{{ vault_url }}/v1/{{ vault_engine_mount }}/role?list=true"
        method:         GET
        headers:
          X-Vault-Namespace: "{{ vault_namespace }}"
          X-Vault-Token:     "{{ login_token }}"
          accept:            application/json
        return_content: true
        status_code:    200
      register: _static_roles_raw
      no_log: true

    - name: "Discover | Assert roles were returned"
      ansible.builtin.assert:
        that:
          - _static_roles_raw.json.data.keys | default([]) | length > 0
        fail_msg: >
          No roles found at '{{ vault_engine_mount }}/role'.
          Check the mount point and token permissions.
        success_msg: >
          Found {{ _static_roles_raw.json.data.keys | length }} role(s) in Vault.

    # --------------------------------------------------------------------------
    # Step 3 — Filter to target user
    # Role name format: <USER>_<DB_UNIQUE_NAME>_EXACC
    # --------------------------------------------------------------------------

    - name: "Discover | Filter roles for target user ({{ target_user }})"
      ansible.builtin.set_fact:
        _target_role_names: >-
          {{
            _static_roles_raw.json.data.keys
            | select('match', '^' + target_user + '_.*_EXACC$')
            | list
          }}

    - name: "Discover | Assert at least one matching role found"
      ansible.builtin.assert:
        that:
          - _target_role_names | length > 0
        fail_msg: >
          No roles matching '{{ target_user }}_*_EXACC' found.
          Check target_user and engine mount.
        success_msg: >
          {{ _target_role_names | length }} {{ target_user }} role(s) identified.

    # --------------------------------------------------------------------------
    # Step 4 — Read all role metadata in parallel
    # Each response provides: username, connection_url, last_vault_rotation,
    # rotation_period, ttl (structure depends on custom engine implementation)
    # --------------------------------------------------------------------------

    - name: "Discover | Read all role metadata in parallel"
      ansible.builtin.uri:
        url:            "{{ vault_url }}/v1/{{ vault_engine_mount }}/role/{{ item }}"
        method:         GET
        headers:
          X-Vault-Namespace: "{{ vault_namespace }}"
          X-Vault-Token:     "{{ login_token }}"
          accept:            application/json
        return_content: true
        status_code:    200
      loop:     "{{ _target_role_names }}"
      async:    30
      poll:     0
      register: _metadata_jobs
      no_log: true

    - name: "Discover | Wait for all metadata reads to complete"
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ _metadata_jobs.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: _metadata_results
      until:   _metadata_results is finished
      retries: 10
      delay:   2
      no_log: true

    # --------------------------------------------------------------------------
    # Step 5 — Parse role names and metadata into inventory records
    #
    # Role name: SYS_FINDB_EXACC
    #   parts[0] = Oracle user        (SYS)
    #   parts[1] = db_unique_name     (FINDB)
    #   parts[2] = literal 'EXACC'
    #
    # connection_url: "host1.domain.com,host2.domain.com,host3.domain.com"
    #   first host = primary node_fqdn
    #   all hosts  = exacc_members
    #
    # secret_age_days calculated from last_vault_rotation timestamp
    # --------------------------------------------------------------------------

    - name: "Discover | Parse role metadata into inventory records"
      ansible.builtin.set_fact:
        _db_inventory: >-
          {{
            _db_inventory | default([]) + [{
              'role_name':            item[0],
              'oracle_user':          (item[0].split('_'))[0],
              'db_unique_name':       (item[0].split('_'))[1],
              'oracle_db_name':       (item[0].split('_'))[1],
              'exacc_members':        item[1].json.data.connection_url.split(','),
              'node_fqdn':            item[1].json.data.connection_url.split(',')[0],
              'username':             item[1].json.data.username,
              'current_sys_password': item[1].json.data.password | default(''),
              'last_vault_rotation':  item[1].json.data.last_vault_rotation | default(''),
              'rotation_period':      item[1].json.data.rotation_period | default(0) | int,
              'ttl':                  item[1].json.data.ttl | default(0) | int,
              'secret_age_days': >-
                {{
                  ((ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
                  - (item[1].json.data.last_vault_rotation
                     | default(ansible_date_time.iso8601)
                     | regex_replace('\\..*Z$', 'Z')
                     | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).days
                }},
            }]
          }}
      loop: "{{ _target_role_names | zip(_metadata_results.results) | list }}"
      loop_control:
        label: "{{ item[0] }}"
      no_log: true

    # --------------------------------------------------------------------------
    # Step 6 — Report full estate rotation status
    # --------------------------------------------------------------------------

    - name: "Discover | Display estate rotation status"
      ansible.builtin.debug:
        msg: >
          {{ item.db_unique_name }} ({{ item.role_name }}) —
          nodes: {{ item.exacc_members | join(', ') }} —
          last rotated {{ item.secret_age_days }} days ago
          ({{ 'ROTATE' if item.secret_age_days | int >= password_max_age_days | int
              else 'OK — ' ~ (password_max_age_days | int - item.secret_age_days | int) ~ ' days remaining' }})
      loop: "{{ _db_inventory }}"
      loop_control:
        label: "{{ item.db_unique_name }}"

    # --------------------------------------------------------------------------
    # Step 7 — Add rotation candidates to in-memory inventory
    # --------------------------------------------------------------------------

    - name: "Discover | Register rotation candidates in Ansible in-memory inventory"
      ansible.builtin.add_host:
        name:   "{{ item.db_unique_name }}"
        groups: rotation_targets
        # --- SSH connection ---
        ansible_host: "{{ item.node_fqdn }}"
        ansible_user: "{{ ssh_user }}"
        # --- Oracle identity ---
        db_unique_name:  "{{ item.db_unique_name }}"
        oracle_db_name:  "{{ item.oracle_db_name }}"
        node_fqdn:       "{{ item.node_fqdn }}"
        exacc_members:   "{{ item.exacc_members }}"
        # --- Vault static engine credential metadata ---
        current_sys_password: "{{ item.current_sys_password }}"
        secret_age_days:      "{{ item.secret_age_days }}"
        last_vault_rotation:  "{{ item.last_vault_rotation }}"
        vault_role_name:      "{{ item.role_name }}"
        # --- Vault connectivity (passed through to the role) ---
        vault_engine_url:   "{{ vault_url }}"
        vault_engine_mount: "{{ vault_engine_mount }}"
        vault_namespace:    "{{ vault_namespace }}"
        login_token:        "{{ login_token }}"
        # --- Estate context ---
        environment: "{{ environment | default('prod') }}"
      loop: >-
        {{
          _db_inventory
          | selectattr('secret_age_days', 'ge', password_max_age_days)
          | list
        }}
      loop_control:
        label: "{{ item.db_unique_name }}"
      no_log: true

    - name: "Discover | Confirm rotation candidates queued"
      ansible.builtin.debug:
        msg: >
          {{ groups['rotation_targets'] | default([]) | length }} of
          {{ _db_inventory | length }} database(s) queued for rotation:
          {{ groups['rotation_targets'] | default([]) | join(', ') | default('none') }}.

# ==============================================================================
# Phase 2 | Execute SYS password rotation against all rotation candidates
# ==============================================================================

- name: "Rotate | Execute SYS password rotation for all rotation candidates"
  hosts: rotation_targets
  gather_facts: true
  serial: "{{ rotation_serial | default(1) }}"
  vars:
    password_max_age_days:      90
    password_min_age_days:      1
    password_length:            20
    min_rollover_time_days:     "{{ 1 / 24 }}"
    dbaascli_path:              "/usr/local/bin/dbaascli"
    dg_max_lag_seconds:         300
    fail_on_active_rman:        true
    breakglass_backup_enabled:  true
    breakglass_backup_path:     "/etc/oracle/breakglass"
    commvault_notify_only:      true
    commvault_notification_log: "/var/log/ansible/commvault_rotation_notice.log"
  roles:
    - role: sys_password_rotation
