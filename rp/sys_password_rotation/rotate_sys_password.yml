---
# ------------------------------------------------------------------------------
# rotate_sys_password.yml
# Custom static database secrets engine driven SYS password rotation.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ PHASE 1 — localhost                                                     │
# │   Vault auth → list all roles → parallel metadata reads (bounded) →    │
# │   build _db_inventory with age, cluster_key, is_standby_hint →         │
# │   populate _verify_candidates (all age-overdue, no pattern gate)        │
# │   fast mode: also populate rotation_targets via standby_name_patterns   │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ PHASE 1.5 — _verify_candidates  [when: verify_db_roles=true]           │
# │   Parallel dbaascli config getDatabases on every overdue candidate      │
# │   Detects failover (standby-named host now PRIMARY, vice versa)         │
# │   Sole gate into rotation_targets — patterns are advisory only          │
# ├─────────────────────────────────────────────────────────────────────────┤
# │ PHASE 2 — rotation_targets                                              │
# │   Execute sys_password_rotation role; serial controls parallelism.      │
# │   Standbys excluded at Phase 1/1.5 — DG-safe at any serial value.      │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Modes:
#   Fast (default, verify_db_roles=false):
#     standby_name_patterns filter builds rotation_targets in Phase 1.
#     precheck_oracle.yml is the safety net (db_role == PRIMARY assertion).
#     Risk: post-failover, new primary with standby-patterned name is missed.
#
#   Verified (verify_db_roles=true):
#     Phase 1.5 runs a live dbaascli role check against every overdue host.
#     Detects failover, handles any naming convention.
#     Adds ~30-60 s to the run (parallelised across forks).
#     Use after a DG failover, or when standby naming is ambiguous.
#
# Required environment variables:
#   HSBC_HASHI_URL        Vault address
#   HSBC_HASHI_NAMESPACE  Vault namespace
#   HSBC_HASHI_ROLE       Vault role for token login
#
# Key extra-vars:
#   verify_db_roles         true|false  live role check via dbaascli (default: false)
#   target_user             SYS         Oracle user to rotate
#   password_max_age_days   90          rotation threshold in days
#   rotation_serial         1           Phase 2 parallelism (int or "10%")
#   vault_api_concurrency   25          max concurrent Vault API calls in Phase 1
#   standby_name_patterns   [list]      hint patterns; not used when verify_db_roles=true
#
# Usage:
#   ansible-playbook rotate_sys_password.yml -e environment=prod
#   ansible-playbook rotate_sys_password.yml -e environment=prod -e verify_db_roles=true
#   ansible-playbook rotate_sys_password.yml -e environment=prod -e rotation_serial="10%"
# ------------------------------------------------------------------------------

# ==============================================================================
# Phase 1 | Discover databases and build in-memory inventory
# ==============================================================================

- name: "Discover | Build in-memory inventory from Vault static Oracle roles"
  hosts: localhost
  gather_facts: true
  vars:
    target_user:           "SYS"
    password_max_age_days: 90
    ssh_user:              "opc"
    vault_engine_mount:    "secrets/static-database"

    # Live dbaascli role verification (Phase 1.5).
    # Set to true after a DG failover or when naming conventions are ambiguous.
    verify_db_roles: false

    # Max simultaneous Vault API calls.
    vault_api_concurrency: 25

    # Advisory hint patterns matched against db_unique_name to classify standbys.
    # Used in fast mode (verify_db_roles=false) as the rotation_targets gate.
    # In verified mode (verify_db_roles=true) these are display-only.
    # Common Oracle DG standby suffixes: DR, STB, SBY, DG with optional digits.
    standby_name_patterns:
      - ".*DR\\d*$"
      - ".*STB\\d*$"
      - ".*SBY\\d*$"
      - ".*DG\\d*$"

  tasks:

    # --------------------------------------------------------------------------
    # Step 1 — Vault authentication
    # --------------------------------------------------------------------------

    - name: "Discover | Obtain Vault login token"
      ansible.builtin.set_fact:
        vault_url:       "{{ lookup('env', 'HSBC_HASHI_URL') | regex_replace('(.*)/v1$', '\\1') }}"
        vault_namespace: "{{ lookup('env', 'HSBC_HASHI_NAMESPACE') }}"
        login_token:     "{{ lookup('hsbc.epe.hashi_vault_login_token', token_ttl=vault_token_ttl | default('6h')) }}"
      no_log: true

    - name: "Discover | Assert Vault connection details are set"
      ansible.builtin.assert:
        that:
          - vault_url | length > 0
          - vault_namespace | length > 0
          - login_token | length > 0
        fail_msg: >
          HSBC_HASHI_URL or HSBC_HASHI_NAMESPACE environment variables are not set,
          or Vault login token could not be obtained.

    # --------------------------------------------------------------------------
    # Step 2 — List all roles (single GET)
    # --------------------------------------------------------------------------

    - name: "Discover | List all static database roles from Vault"
      ansible.builtin.uri:
        url:            "{{ vault_url }}/v1/{{ vault_engine_mount }}/role?list=true"
        method:         GET
        headers:
          X-Vault-Namespace: "{{ vault_namespace }}"
          X-Vault-Token:     "{{ login_token }}"
          accept:            application/json
        return_content: true
        status_code:    200
      register: _static_roles_raw
      no_log: true

    - name: "Discover | Assert roles were returned"
      ansible.builtin.assert:
        that:
          - _static_roles_raw.json.data.keys | default([]) | length > 0
        fail_msg: >
          No roles found at '{{ vault_engine_mount }}/role'.
          Check the mount point and token permissions.
        success_msg: >
          Found {{ _static_roles_raw.json.data.keys | length }} total role(s) in engine.

    # --------------------------------------------------------------------------
    # Step 3 — Filter to target user
    # --------------------------------------------------------------------------

    - name: "Discover | Filter roles for target user '{{ target_user }}'"
      ansible.builtin.set_fact:
        _target_role_names: >-
          {{
            _static_roles_raw.json.data.keys
            | select('match', '^' + target_user + '_.*_EXACC$')
            | list
          }}

    - name: "Discover | Assert at least one matching role found"
      ansible.builtin.assert:
        that:
          - _target_role_names | length > 0
        fail_msg: >
          No roles matching '{{ target_user }}_*_EXACC' found.
          Check target_user (current: '{{ target_user }}') and engine mount.
        success_msg: >
          {{ _target_role_names | length }} '{{ target_user }}' role(s) to inspect.

    # --------------------------------------------------------------------------
    # Step 4 — Read all role metadata with bounded concurrency
    #
    # throttle: limits simultaneous in-flight Vault HTTP calls to prevent burst
    # against the Vault cluster across a large estate.
    # async: 60 / poll: 0 fires each call without blocking.
    # A calculated pause then lets most jobs finish before the polling loop runs,
    # avoiding sequential async_status round-trips for already-complete jobs.
    # --------------------------------------------------------------------------

    - name: "Discover | Read all role metadata (max {{ vault_api_concurrency }} concurrent)"
      ansible.builtin.uri:
        url:            "{{ vault_url }}/v1/{{ vault_engine_mount }}/role/{{ item }}"
        method:         GET
        headers:
          X-Vault-Namespace: "{{ vault_namespace }}"
          X-Vault-Token:     "{{ login_token }}"
          accept:            application/json
        return_content: true
        status_code:    200
      loop:     "{{ _target_role_names }}"
      loop_control:
        label: "{{ item }}"
      throttle: "{{ vault_api_concurrency | int }}"
      async:    60
      poll:     0
      register: _metadata_jobs
      no_log:   true

    - name: "Discover | Allow time for metadata reads to settle"
      ansible.builtin.pause:
        seconds: "{{ [(_target_role_names | length / vault_api_concurrency | int) | int * 2, 5] | max }}"

    - name: "Discover | Collect all metadata read results"
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ _metadata_jobs.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: _metadata_results
      until:    _metadata_results is finished
      retries:  20
      delay:    3
      no_log:   true

    # --------------------------------------------------------------------------
    # Step 5 — Parse metadata into inventory records
    #
    # Fields added beyond the raw Vault data:
    #
    #   cluster_key
    #     Sorted pipe-joined ExaCC hosts from connection_url.
    #     Roles sharing a cluster_key are co-located (DG pair on same rack).
    #     Used in the estate summary to group related DBs visually.
    #
    #   is_standby_hint
    #     True if db_unique_name matches any standby_name_patterns (regex).
    #     Named 'hint' because it is ONLY advisory — it can be wrong after a
    #     DG failover, or when naming conventions differ from the patterns.
    #     In fast mode this drives the rotation_targets gate.
    #     In verified mode (Phase 1.5) this is displayed alongside live result.
    #
    #   secret_age_days
    #     Float days since last_vault_rotation. Missing timestamp → 0 days.
    #     Uses total_seconds()/86400 for sub-day precision.
    # --------------------------------------------------------------------------

    - name: "Discover | Parse role metadata into inventory records"
      ansible.builtin.set_fact:
        _db_inventory: >-
          {{
            _db_inventory | default([]) + [{
              'role_name':            item[0],
              'oracle_user':          (item[0].split('_'))[0],
              'db_unique_name':       (item[0].split('_'))[1],
              'oracle_db_name':       (item[0].split('_'))[1],
              'exacc_members':        item[1].json.data.connection_url.split(',') | map('trim') | list,
              'node_fqdn':            item[1].json.data.connection_url.split(',')[0] | trim,
              'username':             item[1].json.data.username,
              'current_sys_password': item[1].json.data.password | default(''),
              'last_vault_rotation':  item[1].json.data.last_vault_rotation | default(''),
              'rotation_period':      item[1].json.data.rotation_period | default(0) | int,
              'ttl':                  item[1].json.data.ttl | default(0) | int,
              'cluster_key': >-
                {{
                  item[1].json.data.connection_url.split(',')
                  | map('trim') | list | sort | join('|')
                }},
              'is_standby_hint': >-
                {{
                  standby_name_patterns | length > 0
                  and ((item[0].split('_'))[1]
                       | regex_search(standby_name_patterns | join('|'))) is not none
                }},
              'secret_age_days': >-
                {{
                  ((ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
                   - (item[1].json.data.last_vault_rotation
                      | default(ansible_date_time.iso8601)
                      | regex_replace('\\.\\d+Z$', 'Z')
                      | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
                  ).total_seconds() / 86400
                }},
            }]
          }}
      loop: "{{ _target_role_names | zip(_metadata_results.results) | list }}"
      loop_control:
        label: "{{ item[0] }}"
      no_log: true

    # --------------------------------------------------------------------------
    # Step 6 — Estate summary
    #
    # Sorted by cluster_key so DG pairs appear adjacent.
    # HINT suffix on standby classification signals it is pattern-based only.
    # --------------------------------------------------------------------------

    - name: "Discover | Summarise estate — age, cluster, and DG classification"
      ansible.builtin.debug:
        msg: >-
          {{ item.db_unique_name | rjust(30) }}
          age={{ '%5.1f' | format(item.secret_age_days | float) }}d
          cluster={{ item.exacc_members | length }}n
          {%- if item.is_standby_hint %}  STANDBY(hint)
          {%- elif item.secret_age_days | float >= password_max_age_days | float %}  ROTATE
          {%- else %}  ok ({{ (password_max_age_days | float - item.secret_age_days | float) | int }}d left)
          {%- endif %}
          {%- if verify_db_roles | default(false) | bool %}  [live check pending]{% endif %}
      loop: "{{ _db_inventory | sort(attribute='cluster_key') }}"
      loop_control:
        label: "{{ item.db_unique_name }}"

    # --------------------------------------------------------------------------
    # Step 7a — Populate _verify_candidates
    #
    # ALL age-overdue roles go here, regardless of standby_name_patterns.
    # This group is the input for Phase 1.5 (verify mode).
    # In fast mode it is not used by Phase 2, but it is always built so the
    # Phase 1.5 play definition references a group that exists.
    # --------------------------------------------------------------------------

    - name: "Discover | Add all age-overdue candidates to _verify_candidates"
      ansible.builtin.add_host:
        name:   "{{ item.db_unique_name }}"
        groups: _verify_candidates
        # SSH
        ansible_host:  "{{ item.node_fqdn }}"
        ansible_user:  "{{ ssh_user }}"
        # Oracle identity
        db_unique_name:  "{{ item.db_unique_name }}"
        oracle_db_name:  "{{ item.oracle_db_name }}"
        node_fqdn:       "{{ item.node_fqdn }}"
        exacc_members:   "{{ item.exacc_members }}"
        # Vault credential metadata
        current_sys_password: "{{ item.current_sys_password }}"
        secret_age_days:      "{{ item.secret_age_days }}"
        last_vault_rotation:  "{{ item.last_vault_rotation }}"
        vault_role_name:      "{{ item.role_name }}"
        # Vault connectivity
        vault_engine_url:   "{{ vault_url }}"
        vault_engine_mount: "{{ vault_engine_mount }}"
        vault_namespace:    "{{ vault_namespace }}"
        login_token:        "{{ login_token }}"
        # Classification hint for Phase 1.5 display
        is_standby_hint: "{{ item.is_standby_hint }}"
        # Estate context
        environment: "{{ environment | default('prod') }}"
      loop: >-
        {{
          _db_inventory
          | selectattr('secret_age_days', 'ge', password_max_age_days | float)
          | list
        }}
      loop_control:
        label: "{{ item.db_unique_name }}"
      no_log: true

    # --------------------------------------------------------------------------
    # Step 7b — Populate rotation_targets (fast mode only)
    #
    # Applies standby_name_patterns filter. Skipped when verify_db_roles=true;
    # Phase 1.5 builds rotation_targets from live dbaascli results instead.
    # --------------------------------------------------------------------------

    - name: "Discover | Register primary rotation candidates — fast mode (pattern filter)"
      ansible.builtin.add_host:
        name:   "{{ item.db_unique_name }}"
        groups: rotation_targets
        ansible_host:         "{{ item.node_fqdn }}"
        ansible_user:         "{{ ssh_user }}"
        db_unique_name:       "{{ item.db_unique_name }}"
        oracle_db_name:       "{{ item.oracle_db_name }}"
        node_fqdn:            "{{ item.node_fqdn }}"
        exacc_members:        "{{ item.exacc_members }}"
        current_sys_password: "{{ item.current_sys_password }}"
        secret_age_days:      "{{ item.secret_age_days }}"
        last_vault_rotation:  "{{ item.last_vault_rotation }}"
        vault_role_name:      "{{ item.role_name }}"
        vault_engine_url:     "{{ vault_url }}"
        vault_engine_mount:   "{{ vault_engine_mount }}"
        vault_namespace:      "{{ vault_namespace }}"
        login_token:          "{{ login_token }}"
        is_standby_hint:      "{{ item.is_standby_hint }}"
        environment:          "{{ environment | default('prod') }}"
      loop: >-
        {{
          _db_inventory
          | rejectattr('is_standby_hint')
          | selectattr('secret_age_days', 'ge', password_max_age_days | float)
          | list
        }}
      loop_control:
        label: "{{ item.db_unique_name }}"
      when: not verify_db_roles | default(false) | bool
      no_log: true

    - name: "Discover | Rotation queue summary"
      ansible.builtin.debug:
        msg:
          - "Mode               : {{ verify_db_roles | default(false) | bool | ternary('verified (Phase 1.5 live check)', 'fast (standby_name_patterns filter)') }}"
          - "Estate total       : {{ _db_inventory | length }} roles"
          - "Standby hints      : {{ _db_inventory | selectattr('is_standby_hint') | list | length }} ({{ _db_inventory | selectattr('is_standby_hint') | map(attribute='db_unique_name') | list | join(', ') | default('none') }})"
          - "Overdue candidates : {{ groups['_verify_candidates'] | default([]) | length }}"
          - "Queued for rotation: {{ groups['rotation_targets'] | default([]) | length }}{{ ' (pending Phase 1.5)' if verify_db_roles | default(false) | bool else '' }}"


# ==============================================================================
# Phase 1.5 | Live database role verification via dbaascli
#
# Runs against ALL age-overdue candidates (_verify_candidates), irrespective of
# standby_name_patterns. This is the right gate when:
#   - Naming conventions don't reliably indicate PRIMARY vs STANDBY
#   - A DG failover has occurred (old standby promoted; old primary demoted)
#   - You want absolute certainty before Phase 2 starts
#
# Parallelism: no serial set → runs against all hosts simultaneously up to
# ansible.cfg forks (default 5; raise with -f N or forks=N in ansible.cfg).
#
# Detection outcomes displayed per host:
#   CONFIRMED PRIMARY  — live role matches is_standby_hint=false expectation
#   CONFIRMED STANDBY  — live role matches is_standby_hint=true expectation
#   *** FAILOVER DETECTED *** — host was standby-named but is live PRIMARY
#   *** PATTERN MISMATCH ***  — host was primary-named but is not live PRIMARY
#   UNREACHABLE/ERROR         — dbaascli failed; host excluded with warning
# ==============================================================================

- name: "Verify | Confirm live database roles via dbaascli"
  hosts: _verify_candidates
  gather_facts: false
  vars:
    dbaascli_path: "/usr/local/bin/dbaascli"

  tasks:

    - name: "Verify | Skip play — verify_db_roles not enabled"
      ansible.builtin.meta: end_play
      when: not verify_db_roles | default(false) | bool

    # --------------------------------------------------------------------------
    # Run dbaascli config getDatabases on each candidate.
    # ignore_errors: true — unreachable or errored hosts are excluded with a
    # warning rather than aborting the entire verification sweep.
    # --------------------------------------------------------------------------

    - name: "Verify | Run dbaascli config getDatabases"
      ansible.builtin.command:
        cmd: "{{ dbaascli_path }} config getDatabases --dbname {{ oracle_db_name }}"
      register: _verify_dbaascli_raw
      become: true
      become_user: root
      changed_when: false
      ignore_errors: true
      no_log: true

    - name: "Verify | Parse live serviceRole from dbaascli JSON"
      ansible.builtin.set_fact:
        _live_db_role: >-
          {{
            (
              _verify_dbaascli_raw.stdout
              | regex_search('(?s)(\{.*\})', '\1')
              | first
              | from_json
            ).databases.values() | list | first | default({}) | dict2items
            | selectattr('key', 'equalto', 'serviceRole') | map(attribute='value') | first | default('UNKNOWN')
          }}
      when:
        - _verify_dbaascli_raw is succeeded
        - _verify_dbaascli_raw.stdout | length > 0
      ignore_errors: true

    - name: "Verify | Default role to UNKNOWN on dbaascli error"
      ansible.builtin.set_fact:
        _live_db_role: "UNKNOWN"
      when: >-
        _verify_dbaascli_raw is failed
        or _verify_dbaascli_raw.stdout | length == 0
        or _live_db_role is not defined

    # --------------------------------------------------------------------------
    # Report — show hint vs live role, flag mismatches prominently
    # --------------------------------------------------------------------------

    - name: "Verify | Report live role classification"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname | rjust(30) }}:
          hint={{ is_standby_hint | bool | ternary('STANDBY', 'PRIMARY') }}
          live={{ _live_db_role }}
          {%- if is_standby_hint | bool and _live_db_role == 'PRIMARY' %}
            *** FAILOVER DETECTED — standby-named host IS the live PRIMARY ***
          {%- elif not is_standby_hint | bool and _live_db_role not in ['PRIMARY', 'UNKNOWN'] %}
            *** PATTERN MISMATCH — primary-named host is live {{ _live_db_role }} ***
          {%- elif _live_db_role == 'UNKNOWN' %}
            WARNING — dbaascli failed; host excluded from rotation
          {%- elif _live_db_role == 'PRIMARY' %}
            ok — queuing for rotation
          {%- else %}
            ok — standby; excluded from rotation
          {%- endif %}

    # --------------------------------------------------------------------------
    # Gate: add confirmed PRIMARYs to rotation_targets.
    # Hosts where _live_db_role is not PRIMARY (STANDBY, UNKNOWN, error) are
    # simply not added — no assertion failure, no play abort.
    # The existing hostvars set in Phase 1 are preserved on the host object;
    # add_host with just name+group inherits them automatically.
    # --------------------------------------------------------------------------

    - name: "Verify | Add confirmed PRIMARYs to rotation_targets"
      ansible.builtin.add_host:
        name:   "{{ inventory_hostname }}"
        groups: rotation_targets
      when: _live_db_role | upper == 'PRIMARY'

    - name: "Verify | Warn on excluded candidates"
      ansible.builtin.debug:
        msg: >
          WARNING: {{ inventory_hostname }} excluded from rotation.
          Live role={{ _live_db_role }}.
          {% if _live_db_role == 'UNKNOWN' %}
          dbaascli failed — investigate connectivity before next run.
          {% elif _live_db_role != 'PRIMARY' %}
          This is a {{ _live_db_role }}. Its password is managed via primary
          rotation blob propagation. If unexpected, check DG topology.
          {% endif %}
      when: _live_db_role | upper != 'PRIMARY'

    - name: "Verify | Display verified rotation queue"
      ansible.builtin.debug:
        msg:
          - "Verified rotation targets: {{ groups['rotation_targets'] | default([]) | length }}"
          - "Targets: {{ groups['rotation_targets'] | default([]) | join(', ') | default('none') }}"
      run_once: true


# ==============================================================================
# Phase 2 | Execute SYS password rotation against confirmed primaries
#
# rotation_targets contains only confirmed PRIMARYs at this point:
#   - Fast mode: filtered by standby_name_patterns in Phase 1
#   - Verified mode: filtered by live dbaascli result in Phase 1.5
#
# In both modes precheck_oracle.yml's db_role == PRIMARY assertion is a
# second safety net. Any host that slips through (e.g., fast mode with
# ambiguous naming) fails cleanly at precheck before any changes are made.
#
# Parallelism:
#   Because standbys are excluded before Phase 2 starts, there are no
#   DG pair conflicts regardless of serial value.
#   Cap serial at ansible.cfg forks= (use -f N to raise the limit).
#   rotation_serial: "10%"  is a good starting point for a large estate.
#
# max_fail_percentage: 0
#   If any single DB fails (e.g., Oracle changed but Vault write failed),
#   the play stops immediately. A partial failure state (DB password changed
#   but Vault out of sync) is critical — stopping prevents further DBs
#   entering the same state while the operator investigates.
#   Override with -e rotation_max_fail_pct=100 to continue on failures.
# ==============================================================================

- name: "Rotate | Execute SYS password rotation for all confirmed primary candidates"
  hosts: rotation_targets
  gather_facts: true
  serial: "{{ rotation_serial | default(1) }}"
  max_fail_percentage: "{{ rotation_max_fail_pct | default(0) }}"
  vars:
    password_max_age_days:      90
    password_min_age_days:      1
    password_length:            20
    min_rollover_time_days:     "{{ 1 / 24 }}"
    dbaascli_path:              "/usr/local/bin/dbaascli"
    dg_max_lag_seconds:         300
    fail_on_active_rman:        true
    breakglass_backup_enabled:  true
    breakglass_backup_path:     "/etc/oracle/breakglass"
    commvault_notify_only:      true
    commvault_notification_log: "/var/log/ansible/commvault_rotation_notice.log"
  roles:
    - role: sys_password_rotation
